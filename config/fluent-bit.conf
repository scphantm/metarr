# The metarr-server binary POSTs every log record it sees — its own and
# every agent's, all published to the shared Redis channel and forwarded from
# there — to this input. From here on, OpenObserve is an implementation
# detail: this file is the only thing that has to change to ship somewhere
# else instead.
#
# To switch to Splunk: replace the OUTPUT block below with `name splunk`
# (Fluent Bit ships a Splunk HEC output natively). To switch to
# Elasticsearch: `name es`. Neither the two Metarr binaries nor
# fluent-bit.conf's INPUT block need to change either way — see the Logging
# section of CLAUDE.md.
#
# Config values below are pulled from the environment (Fluent Bit expands
# ${VAR} in its config files) so credentials never need to be hardcoded here.
# docker-compose.yml supplies them from .env.

[SERVICE]
    flush        1
    log_level    info

[INPUT]
    name         http
    host         0.0.0.0
    port         8888
    tag          app_logs

[OUTPUT]
    name              http
    match             app_logs
    host              openobserve
    port              5080
    uri               /api/${OPENOBSERVE_ORG}/${OPENOBSERVE_STREAM}/_json
    format            json
    http_user         ${OPENOBSERVE_ROOT_EMAIL}
    http_passwd       ${OPENOBSERVE_ROOT_PASSWORD}
    tls               off

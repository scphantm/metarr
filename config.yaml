# Metarr root configuration.
#
# This file is the single source of connection info for the backend
# services. In docker-compose, the credentials below match the users
# provisioned by mongo/init/init-mongo.js. For local (non-docker)
# development, point the host at "localhost" instead of "mongodb".
#
# The path to this file can be overridden with the METARR_CONFIG_FILE
# environment variable; otherwise the app looks for it at the project root.

mongodb:
  # Read/write credential — used only for the app's own data
  # (user profiles, saved queries). Never used to touch the media library.
  app_uri: "mongodb://metarr:metarr@mongodb:27017/metarr?authSource=metarr"

  # Read-only credential — used exclusively by the Search screen to query
  # the media library. This user has the Mongo "read" role only, so writes
  # are rejected by the database itself, independent of application logic.
  readonly_uri: "mongodb://readonly:readonlypassword@mongodb:27017/metarr?authSource=metarr"

  database: metarr

redis:
  # Backs the job queue: job state is stored here and new work is
  # announced over a Redis Pub/Sub channel (see app/jobs/queue.py).
  # The password must match REDIS_PASSWORD in .env, which is what
  # docker-compose passes to redis-server. This file is parsed as plain YAML —
  # no shell substitution happens here — so the two are kept in step by hand.
  uri: "redis://:metarr@redis:6379/0"

server:
  host: "0.0.0.0"
  port: 8080

logging:
  # Where the server forwards centralized log records for shipping to
  # OpenObserve — Fluent Bit's HTTP input (see fluent-bit/fluent-bit.conf).
  # Optional: leave blank and the server still logs to stdout and Redis, it
  # just won't forward anywhere. Swapping OpenObserve for Splunk or ELK is a
  # change to fluent-bit.conf, not to this URL.
  forward_url: "http://fluent-bit:8888/app_logs"

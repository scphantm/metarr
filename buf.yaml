version: v2
modules:
  - path: proto
# The AIP config protos import only well-known types bundled with buf itself
# (google/protobuf/field_mask.proto, struct.proto, timestamp.proto), so there
# is no dep entry and no buf.lock. The config API adopts AIP's method names,
# resource shapes, FieldMask partial update and List contract only — not
# long-running operations, etag concurrency, or resource-name addressing
# (docs/adr/0010) — so nothing here needs google.api.field_behavior or
# google.longrunning, and buf.build/googleapis/googleapis is not a dependency.
# The proto/metarr/bus/v1 package is the language-agnostic event-bus contract
# (docs/adr/0008): the EventEnvelope and the server<->agent contract messages a
# participant in any language implements. It carries a strict breaking-change
# guarantee: the `.github/workflows/proto.yml` CI job runs the FILE-level
# `buf breaking` check below against origin/main, scoped with `--path
# proto/metarr/bus`, on every proto change. A change to anything under
# proto/metarr/bus/ is a published-contract break, not an internal one. The
# metarr.v1 CRUD/config/auth/stats protos deliberately stay out of that
# package — they are never in the `--path` scope — so they churn per release
# and an external author never depends on them.
lint:
  use:
    - STANDARD
  except:
    # Deliberate: the AIP standard methods return the stored resource
    # directly (AIP-134 Update, AIP-131 Get) or google.protobuf.Empty
    # (Delete), none of which is named {Method}Response, and a few reads
    # share a response message rather than minting an identical-shaped one.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE

syntax = "proto3";

package metarr.v1;

import "google/protobuf/field_mask.proto";

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// AdminUser is the system's single administrative user account. This message
// is the single definition of that account across the Go server, the UI and
// the stored document (docs/adr/0005).
//
// password_salt and password_hash are the stored credential. They are never
// populated in a client-facing response: GetAdminUser blanks both on the
// clone it returns, and a new password reaches the server only through
// UpdateAdminUserRequest.new_password (docs/adr/0005). A generated client
// therefore sees two fields that are always empty — the deliberate cost of
// one definition for the wire shape and the stored shape.
message AdminUser {
  string username = 1;
  string email = 2;
  string password_salt = 3;
  string password_hash = 4;
}

message GetAdminUserRequest {}

// UpdateAdminUserRequest is an AIP-134 partial update of the single admin
// account. update_mask names the identity fields to change (username, email)
// and admin carries their new values; an empty mask or a path naming
// anything other than username / email is InvalidArgument. A set field that
// is empty (an explicit "") is rejected rather than silently clearing the
// value.
//
// new_password is never named by the mask (a hash is never on the wire,
// docs/adr/0005). It is acted on only when non-empty: a non-empty value
// re-hashes and replaces the stored credential, an empty one is a no-op. A
// request may carry only new_password (an empty mask is then allowed) to
// change the password without touching the identity.
message UpdateAdminUserRequest {
  AdminUser admin = 1;
  google.protobuf.FieldMask update_mask = 2;
  string new_password = 3;
}

// AdminService owns the single administrative account (docs/adr/0010). The
// write is synchronous: it persists under the config store lock, propagates
// in-process, and returns the stored account with the credential fields
// blanked before the RPC returns (docs/adr/0002).
service AdminService {
  rpc GetAdminUser(GetAdminUserRequest) returns (AdminUser);
  // UpdateAdminUser returns the stored account (credential fields blanked)
  // after the synchronous write has landed (AIP-134).
  rpc UpdateAdminUser(UpdateAdminUserRequest) returns (AdminUser);
}

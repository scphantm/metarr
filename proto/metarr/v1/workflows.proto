syntax = "proto3";

package metarr.v1;

import "google/protobuf/timestamp.proto";
import "metarr/v1/workflow_graph.proto";

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// Workflow is one version of a versioned workflow document: the scalar
// metadata plus the authored graph. internal/server/mongostore.Workflow is
// the stored form; internal/shared/workflow aliases WorkflowGraph and its
// parts. See docs/adr/0005.
//
// The graph's open content — a node's settings, and its extra field — is
// carried as structured values so a node whose type this build does not
// recognise, and settings it does not recognise, round-trip through storage
// unchanged. schema_version lives on WorkflowGraph, which is the canonical
// graph shape the catalog also advertises.
message Workflow {
  string id = 1;
  string document_id = 2;
  int32 version = 3;
  google.protobuf.Timestamp created_at = 4;
  string name = 5;
  string description = 6;
  repeated string tags = 7;
  WorkflowGraph graph = 8;
}

message WorkflowServiceListRequest {
  int32 limit = 1;
  string cursor = 2;
}

message WorkflowServiceListResponse {
  repeated Workflow workflows = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message WorkflowServiceGetRequest {
  string id = 1;
}

message WorkflowServiceGetResponse {
  Workflow workflow = 1;
}

message WorkflowServiceListVersionsRequest {
  string id = 1;
}

message WorkflowServiceListVersionsResponse {
  repeated Workflow versions = 1;
}

message WorkflowServiceGetVersionRequest {
  string id = 1;
  int32 version = 2;
}

message WorkflowServiceGetVersionResponse {
  Workflow workflow = 1;
}

// WorkflowServiceUpsertRequest omits id/version/created_at — Upsert decides
// those. document_id empty creates a new workflow (version 1); set, it
// appends a new version. Nothing is ever overwritten in place.
message WorkflowServiceUpsertRequest {
  string document_id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  WorkflowGraph graph = 5;
}

message WorkflowServiceUpsertResponse {
  Workflow workflow = 1;
}

// WorkflowService is a direct, synchronous Mongo read/write (see
// UpsertWorkflow's doc comment on the Go side): Upsert appends a new
// immutable version and returns the persisted Workflow.
service WorkflowService {
  rpc List(WorkflowServiceListRequest) returns (WorkflowServiceListResponse);
  rpc Get(WorkflowServiceGetRequest) returns (WorkflowServiceGetResponse);
  rpc ListVersions(WorkflowServiceListVersionsRequest) returns (WorkflowServiceListVersionsResponse);
  rpc GetVersion(WorkflowServiceGetVersionRequest) returns (WorkflowServiceGetVersionResponse);
  rpc Upsert(WorkflowServiceUpsertRequest) returns (WorkflowServiceUpsertResponse);
}

syntax = "proto3";

package metarr.v1;

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// Both RPCs carry the exact JSON internal/server/redisstats.Snapshot already
// produced over REST/WebSocket, kept opaque rather than modeled — read-only
// telemetry with no forward-compat requirement, same reasoning as
// workflow_catalog.proto and local_directories.proto.

message StatsServiceGetRequest {}

message StatsServiceGetResponse {
  bytes snapshot_json = 1;
}

message StatsServiceStreamRequest {}

message StatsServiceStreamResponse {
  bytes snapshot_json = 1;
}

// StatsService.Get is the REST-era first-paint fallback (a dashboard needs
// something to paint before its stream connects); Stream is the same
// snapshot pushed continuously, replacing the stats.redis wsbus topic.
service StatsService {
  rpc Get(StatsServiceGetRequest) returns (StatsServiceGetResponse);
  rpc Stream(StatsServiceStreamRequest) returns (stream StatsServiceStreamResponse);
}

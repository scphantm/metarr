syntax = "proto3";

package metarr.v1;

import "google/protobuf/timestamp.proto";

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// BusSnapshot is a point-in-time view of the Redis instance backing the
// event bus: a handful of server-wide counters, the depth and
// consumer-group state of every event stream, and the subscriber count of
// every Pub/Sub channel. It is the single
// definition of that shape — the Go sampler (internal/server/busstats
// aliases these messages) and the dashboard both read it. See docs/adr/0007.
//
// One background sampler per server process fills this on a fixed interval
// into one shared in-process value with a short rolling history; every
// dashboard viewer reads that shared value. There is no per-viewer Redis
// traffic.
//
// The event streams and the Pub/Sub channels are not two flavours of one
// thing. Streams are durable — messages sit on them until acknowledged, so
// depth and pending counts are real numbers. Pub/Sub holds nothing, so
// BusChannelStat carries a subscriber count and no depth.
message BusSnapshot {
  google.protobuf.Timestamp collected_at = 1;
  BusServerInfo server = 2;
  // streams carries one row per durable stream the event bus knows about —
  // the static stream-topic rows plus the per-agent command streams
  // discovered against live Redis. channels carries one row per Pub/Sub
  // channel: every channel live against Redis right now unioned with the
  // fixed known-channel list, so a declared channel with no current
  // subscriber still shows as a row.
  repeated BusStreamStat streams = 3;
  repeated BusChannelStat channels = 4;
}

// BusServerInfo holds the instance-wide counters, read from INFO and DBSIZE.
//
// Each Redis call in a sampler pass is time-boxed on its own. A call that
// fails blanks only the fields it feeds and names each of them in
// field_errors; the rest of the snapshot is still delivered. Only losing
// the connection outright fails the whole pass, and then the last good
// snapshot is kept and ages out as stale on the dashboard.
message BusServerInfo {
  string version = 1;
  int64 uptime_seconds = 2;
  int64 connected_clients = 3;
  int64 used_memory = 4;
  string used_memory_human = 5;
  int64 ops_per_second = 6;
  int64 total_keys = 7;

  // Rolling per-metric history, oldest sample first, one entry per sampler
  // pass (capped at ~150 samples, ~5 min at the 2s cadence). Empty until the
  // sampler has taken its first pass. These back the tile sparklines.
  repeated int64 connected_clients_series = 8;
  repeated int64 used_memory_series = 9;
  repeated int64 ops_per_second_series = 10;
  repeated int64 total_keys_series = 11;

  // field_errors maps a blanked field name (for example "connected_clients"
  // or "total_keys") to the error that blanked it on the last pass. Empty on
  // a clean pass.
  map<string, string> field_errors = 12;
}

// BusStreamStat is one event stream and the consumer groups reading it.
message BusStreamStat {
  string stream = 1;
  string event_name = 2;
  int64 length = 3;
  // exists distinguishes an empty stream from one that has never been
  // created — streams are created lazily, when a listener first subscribes.
  bool exists = 4;
  repeated BusGroupStat groups = 5;
  // error records a per-stream failure; one unreadable stream should not
  // cost the caller the rest of the snapshot.
  string error = 6;
  // publish_rate is entries added to the stream since the previous sampler
  // pass — the delta of Redis's total entries-added counter, not an absolute
  // count. It is zero on the first pass that sees a stream (no prior sample
  // to subtract) and when Redis does not report the counter.
  int64 publish_rate = 7;

  // Rolling per-metric history, oldest sample first, one entry per sampler
  // pass, capped at the ring-buffer window (~150 samples, ~5 min). These
  // back the row's inline sparklines.
  repeated int64 length_series = 8;
  repeated int64 publish_rate_series = 9;

  // expected_identities lists the processes that should be reading this
  // stream's consumer group, derived from the durable stream-topic list and
  // the registered agents: "metarr-server" for a server-consumed stream,
  // "metarr-agent-<slug>" for an agent's command stream. Empty for a
  // reserved stream nothing consumes yet — such a row is never flagged.
  repeated string expected_identities = 10;
  // flagged is true when the live consumer count on the expected group is
  // below the number of expected identities: a consumer that should be
  // attached is not. A crashed or disconnected agent shows as a flagged row
  // rather than vanishing.
  bool flagged = 11;
  // missing_identities names which of expected_identities are absent,
  // disambiguated by the agent presence keys — an agent identity with no
  // live presence key. Empty unless flagged.
  repeated string missing_identities = 12;
}

// BusGroupStat is one consumer group's position on a stream.
message BusGroupStat {
  string name = 1;
  int64 consumers = 2;
  int64 pending = 3;
  int64 lag = 4;
  string last_delivered_id = 5;
  repeated BusConsumerStat consumer_detail = 6;
  // oldest_pending_age_seconds is how long the group's oldest unacknowledged
  // entry has been waiting, derived from the entry ID's timestamp. Zero when
  // the group has nothing pending.
  int64 oldest_pending_age_seconds = 7;
  // consume_rate is entries read by the group since the previous sampler
  // pass — the delta of Redis's per-group entries-read counter, not an
  // absolute count. Zero on the first pass that sees a group and when Redis
  // does not report the counter.
  int64 consume_rate = 8;

  // Rolling per-metric history, oldest sample first, one entry per sampler
  // pass, capped at the ring-buffer window. These back the expanded row's
  // inline sparklines.
  repeated int64 consumers_series = 9;
  repeated int64 pending_series = 10;
  repeated int64 lag_series = 11;
  repeated int64 oldest_pending_age_seconds_series = 12;
  repeated int64 consume_rate_series = 13;
}

// BusConsumerStat is a single consumer within a group.
message BusConsumerStat {
  string name = 1;
  int64 pending = 2;
  int64 idle_seconds = 3;
}

// BusChannelStat is one Pub/Sub channel. It carries no message count and no
// publish rate: Redis Pub/Sub queues nothing and exposes no per-channel
// publish counter.
message BusChannelStat {
  string channel = 1;
  int64 subscribers = 2;
  // known marks the application's declared channels: the fixed
  // known-channel list plus every registered agent's per-agent channels
  // (config-changed and request). Channels discovered at runtime — the
  // per-correlation-id reply channels — come back false, so the dashboard
  // can tell a transient channel from a declared one and flag a declared
  // channel that has dropped below its expected subscriber count.
  bool known = 3;

  // expected_identities lists the processes that should be subscribed to
  // this channel, derived from topology: "metarr-server" for a fixed
  // known channel, "metarr-agent-<slug>" for a per-agent channel. Empty
  // for a transient channel.
  repeated string expected_identities = 4;
  // flagged is true when the live subscriber count is below the number of
  // expected identities: a subscriber that should be attached is not.
  bool flagged = 5;
  // missing_identities names which of expected_identities are absent,
  // disambiguated by the agent presence keys. Empty unless flagged.
  repeated string missing_identities = 6;
}

message StatsServiceGetRequest {}

message StatsServiceGetResponse {
  BusSnapshot snapshot = 1;
}

message StatsServiceStreamRequest {}

message StatsServiceStreamResponse {
  BusSnapshot snapshot = 1;
}

// StatsServicePurgeRequest names what to clear: one stream by name, or every
// discovered durable stream when all is set. Exactly one of the two must be
// given — an empty stream with all unset, or a stream name with all set, is
// rejected.
message StatsServicePurgeRequest {
  string stream = 1;
  bool all = 2;
}

// StreamPurgeResult is the outcome for one purged stream: how many entries
// the approximate trim dropped, and the consumer groups it fast-forwarded
// to the stream's tail. A stream that had no groups reports an empty list.
message StreamPurgeResult {
  string stream = 1;
  int64 dropped = 2;
  repeated string groups_fast_forwarded = 3;
}

message StatsServicePurgeResponse {
  repeated StreamPurgeResult results = 1;
}

// StatsService.Get is the first-paint fallback (a dashboard needs something
// to paint before its stream connects); Stream is the same snapshot pushed
// on every sampler tick, fanned out from the shared store. Purge clears a
// jammed durable stream (or all of them): an approximate trim of every
// current entry, then a fast-forward of each consumer group to the tail. It
// is the one non-read-only method on the service — see docs/adr/0007.
service StatsService {
  rpc Get(StatsServiceGetRequest) returns (StatsServiceGetResponse);
  rpc Stream(StatsServiceStreamRequest) returns (stream StatsServiceStreamResponse);
  rpc Purge(StatsServicePurgeRequest) returns (StatsServicePurgeResponse);
}

syntax = "proto3";

package metarr.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "metarr/v1/common.proto";

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// LoggingConfig controls the centralized logging pipeline: the servers own
// log level, plus informational fields describing where Fluent Bit ships
// logs. Each agents own level lives on its AgentConfig entry instead.
message LoggingConfig {
  string server_level = 1;
  string sink = 2;
  string endpoint = 3;
  string stream = 4;
}

message GetLoggingConfigRequest {}

message GetLoggingConfigResponse {
  LoggingConfig config = 1;
}

// UpdateLoggingConfigRequest is an AIP-134 partial update: update_mask names
// the fields to change and config carries their new values. A missing config,
// an empty mask, or a path naming no LoggingConfig field is rejected with
// InvalidArgument (docs/adr/0010). The write goes through the config store as
// a scoped mutation — the masked fields are merged onto cfg.Logging.
message UpdateLoggingConfigRequest {
  LoggingConfig config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

// LogRecord is the vendor-neutral shape of one log line, shared by both
// binaries. It is the single definition of that shape:
// internal/shared/logging aliases it, publishes it to Redis (where Fluent
// Bit ships it onward), and the live-tail pane on the Logging screen reads
// it. It deliberately carries no vendor-specific field names — Fluent Bit's
// own filters do that translation, which is what keeps the vendor swappable
// at the Fluent Bit layer rather than this one.
//
// time is an RFC3339 nanosecond string rather than google.protobuf.Timestamp
// because that string is the vendor-neutral wire form Fluent Bit already
// consumes verbatim; normalising it through a Timestamp would change the
// bytes on the Redis channel for no gain here.
message LogRecord {
  string time = 1;
  string level = 2;
  string message = 3;
  string source = 4;
  // attrs is the caller's free-form key/value context, carried as a
  // structured value so typing the record does not flatten what a caller
  // attached to it. Absent when the caller attached nothing.
  google.protobuf.Struct attrs = 5;
}

message LoggingServiceGetTailRequest {}

// LoggingServiceGetTailResponse/StreamTailResponse carry the tail buffer as
// typed LogRecord messages, oldest first.
message LoggingServiceGetTailResponse {
  repeated LogRecord records = 1;
}

message LoggingServiceStreamTailRequest {}

message LoggingServiceStreamTailResponse {
  repeated LogRecord records = 1;
}

// LoggingService covers the whole Logging screen: config (server level,
// pipeline info), GetTail (first-paint fallback for the live tail), and
// StreamTail (the same tail buffer pushed continuously, replacing the
// logging.tail wsbus topic).
service LoggingService {
  rpc GetLoggingConfig(GetLoggingConfigRequest) returns (GetLoggingConfigResponse);
  rpc UpdateLoggingConfig(UpdateLoggingConfigRequest) returns (metarr.v1.AcceptedResponse);
  rpc GetTail(LoggingServiceGetTailRequest) returns (LoggingServiceGetTailResponse);
  rpc StreamTail(LoggingServiceStreamTailRequest) returns (stream LoggingServiceStreamTailResponse);
}

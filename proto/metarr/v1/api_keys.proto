syntax = "proto3";

package metarr.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// APIKeyEntry is a single named API key. This message is the single
// definition of that entry across the Go server, the UI and the stored
// document (docs/adr/0005).
//
// id is the server-minted handle every scoped operation addresses the entry
// by (docs/adr/0010, "Minted id"): GetApiKey / UpdateApiKey / DeleteApiKey
// take it, CreateApiKey carries none and the server mints one.
message APIKeyEntry {
  string name = 1;
  string api_key = 2;
  string id = 3;
}

// APIKeysConfig groups the API keys issued for each access level. It is a
// storage shape only — the API addresses individual keys by minted id and
// scopes Create / List by the AccessLevel enum, never by this message's
// field names.
message APIKeysConfig {
  repeated APIKeyEntry admin = 1;
  repeated APIKeyEntry user = 2;
  repeated APIKeyEntry webhook = 3;
  repeated APIKeyEntry read_only = 4;
}

// AccessLevel is the fixed four-value set of API-key categories. It is a
// request field on the API-key collection methods, not a resource: AIP says
// a closed enumeration like this should not be a resource collection, so
// there is no parent addressing and no AccessLevelService (docs/adr/0010).
// ACCESS_LEVEL_UNSPECIFIED is the unset value and is always InvalidArgument
// where a level is required.
enum AccessLevel {
  ACCESS_LEVEL_UNSPECIFIED = 0;
  ACCESS_LEVEL_ADMIN = 1;
  ACCESS_LEVEL_USER = 2;
  ACCESS_LEVEL_WEBHOOK = 3;
  ACCESS_LEVEL_READ_ONLY = 4;
}

// CreateApiKeyRequest carries no id — the server mints one and returns the
// stored resource with it set (docs/adr/0010, "Minted id"). access_level
// selects the category the key is created in; ACCESS_LEVEL_UNSPECIFIED is
// InvalidArgument. An id set on api_key is InvalidArgument.
message CreateApiKeyRequest {
  AccessLevel access_level = 1;
  APIKeyEntry api_key = 2;
}

message GetApiKeyRequest {
  string id = 1;
}

// ListApiKeysRequest is scoped to one access_level (ACCESS_LEVEL_UNSPECIFIED
// is InvalidArgument) and is otherwise the AIP-158 / 132 / 160 List
// contract: a page_size / page_token window, an order_by sort (name, id),
// and a filter entry point. filter translation is deferred (docs/adr/0010) —
// any non-empty filter is Unimplemented.
message ListApiKeysRequest {
  AccessLevel access_level = 1;
  int32 page_size = 2;
  string page_token = 3;
  string filter = 4;
  string order_by = 5;
}

message ListApiKeysResponse {
  repeated APIKeyEntry api_keys = 1;
  string next_page_token = 2;
}

// UpdateApiKeyRequest is an AIP-134 partial update matched to a stored entry
// by api_key.id. update_mask names the fields to change (name, api_key) and
// api_key carries their new values. An empty mask or a path naming anything
// else is InvalidArgument. There is no allow_missing — the id is
// server-minted, so an Update against an unknown id is NotFound, never a
// create.
message UpdateApiKeyRequest {
  APIKeyEntry api_key = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteApiKeyRequest {
  string id = 1;
}

// ApiKeyService is the API-key collection on AIP standard methods
// (docs/adr/0010): minted-id addressed, Create / List scoped by the
// AccessLevel enum, FieldMask partial update, paginated List. Reads come
// from live config; every write goes through AppConfigStore.MutateSync —
// persist under the store lock, propagate in-process, return the stored
// resource (docs/adr/0002).
service ApiKeyService {
  rpc CreateApiKey(CreateApiKeyRequest) returns (APIKeyEntry);
  rpc GetApiKey(GetApiKeyRequest) returns (APIKeyEntry);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
  // UpdateApiKey returns the stored entry after the synchronous write has
  // landed (AIP-134).
  rpc UpdateApiKey(UpdateApiKeyRequest) returns (APIKeyEntry);
  rpc DeleteApiKey(DeleteApiKeyRequest) returns (google.protobuf.Empty);
}

syntax = "proto3";

package metarr.v1;

import "google/protobuf/field_mask.proto";

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// EventBusConfig tunes the Redis event bus without a rebuild (docs/adr/0006):
// the stream size cap, the retention window, and the Router's retry policy.
// Server-side reads come from live config; the built-in defaults in
// builtin_defaults.json are the values a fresh install runs with and match
// eventbus.DefaultRetryPolicy / DefaultRetentionPolicy.
message EventBusConfig {
  // Field 2 was max_len_default, alongside a max_len_high tier that is gone
  // (scphantm/metarr#47): one cap now covers every stream. Reserved so the
  // number is not reused.
  reserved 2;
  reserved "max_len_high", "max_len_default";

  // max_len is the approximate MAXLEN applied to every stream at publish
  // time.
  int32 max_len = 1;
  // retention_hours is how far back the periodic XTRIM sweep keeps entries.
  // The external-subscriber contract is at least 48 hours, or MAXLEN
  // entries, whichever is larger; setting this below 48 narrows that
  // guarantee.
  int32 retention_hours = 3;
  // retry_attempts is the number of retries after the first attempt before
  // a handler's message is logged at error level and acked (dropped).
  int32 retry_attempts = 4;
  // retry_backoff_base_ms is the wait before the first retry.
  int32 retry_backoff_base_ms = 5;
  // retry_backoff_max_ms caps the exponential backoff between retries.
  int32 retry_backoff_max_ms = 6;

  // Field 7 was etag, an AIP-154 concurrency token. Config writes are
  // synchronous under a single-writer lock (docs/adr/0002) so there is no
  // stale-read window to guard; the field was removed. Reserved so the
  // number is not reused.
  reserved 7;
  reserved "etag";
}

message GetEventBusConfigRequest {}

message GetEventBusConfigResponse {
  EventBusConfig config = 1;
}

// UpdateEventBusConfigRequest is an AIP-134 partial update: update_mask names
// the fields to change and config carries their new values. A missing config,
// an empty mask, or a path naming no EventBusConfig field is rejected with
// InvalidArgument (docs/adr/0010). The write goes through the config store as a
// scoped mutation — the masked fields are merged onto cfg.EventBus — never a
// whole-document write, and blocks until the change has persisted and
// propagated in-process (docs/adr/0002).
message UpdateEventBusConfigRequest {
  EventBusConfig config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

// EventBusService views and edits the event_bus config section. Both reads
// and writes go through the same config store path as every other setting.
service EventBusService {
  rpc GetEventBusConfig(GetEventBusConfigRequest) returns (GetEventBusConfigResponse);
  // UpdateEventBusConfig returns the stored section after the synchronous
  // write has landed (AIP-134).
  rpc UpdateEventBusConfig(UpdateEventBusConfigRequest) returns (EventBusConfig);
}

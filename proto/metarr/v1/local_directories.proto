syntax = "proto3";

package metarr.v1;

import "metarr/v1/metadata.proto";
import "metarr/v1/scan.proto";

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// Read-only access to the scan records the agents produced. The responses
// carry the generated scan record messages directly (scanmodel aliases
// them) — proto is the single definition for a model that crosses a
// language boundary. See docs/adr/0005.

message LocalDirectoryServiceListDirectoriesRequest {
  string type = 1;
  string scan_root = 2;
  int32 limit = 3;
  int32 skip = 4;
}

message LocalDirectoryServiceListDirectoriesResponse {
  repeated TVSeries directories = 1;
}

message LocalDirectoryServiceGetDirectoryRequest {
  string id = 1;
}

message LocalDirectoryServiceGetDirectoryResponse {
  TVSeries directory = 1;
}

message LocalDirectoryServiceListMediaFilesRequest {
  string directory_id = 1;
}

message LocalDirectoryServiceListMediaFilesResponse {
  repeated MediaFile media_files = 1;
}

message LocalDirectoryServiceGetMediaFileRequest {
  string id = 1;
}

message LocalDirectoryServiceGetMediaFileResponse {
  MediaFile media_file = 1;
}

message LocalDirectoryServiceGetDirectoryNFORequest {
  string directory_id = 1;
  string path = 2;
}

message LocalDirectoryServiceGetDirectoryNFOResponse {
  Metadata metadata = 1;
}

service LocalDirectoryService {
  rpc ListDirectories(LocalDirectoryServiceListDirectoriesRequest) returns (LocalDirectoryServiceListDirectoriesResponse);
  rpc GetDirectory(LocalDirectoryServiceGetDirectoryRequest) returns (LocalDirectoryServiceGetDirectoryResponse);
  rpc ListMediaFiles(LocalDirectoryServiceListMediaFilesRequest) returns (LocalDirectoryServiceListMediaFilesResponse);
  rpc GetMediaFile(LocalDirectoryServiceGetMediaFileRequest) returns (LocalDirectoryServiceGetMediaFileResponse);
  rpc GetDirectoryNFO(LocalDirectoryServiceGetDirectoryNFORequest) returns (LocalDirectoryServiceGetDirectoryNFOResponse);
}

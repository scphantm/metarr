syntax = "proto3";

package metarr.v1;

import "google/protobuf/timestamp.proto";
import "metarr/bus/v1/agent_contract.proto";
import "metarr/v1/common.proto";

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// The operator's side of agent configuration, plus the agent view the server
// serves to the UI. The server<->agent contract messages (AgentIdentity,
// AgentTelemetry, GPUTelemetry, AgentPresence, AgentConfigProjection,
// MappedDirectory) live in metarr.bus.v1 (docs/adr/0008); this file imports
// them. internal/shared/agentproto aliases the contract types,
// internal/server/agentregistry aliases the view types, and the TypeScript
// UI reads the generated code. See docs/adr/0005.

// AgentConfig is the operator's side of one agent's configuration — what an
// operator says about an agent that has announced itself. It is part of the
// application config document.
message AgentConfig {
  string slug = 1;
  string display_name = 2;
  repeated AgentDirectoryMapping mappings = 3;
  string log_level = 4;
}

// AgentDirectoryMapping ties one configured scan directory to the path the
// agent knows it by.
message AgentDirectoryMapping {
  string scanner_slug = 1;
  string agent_path = 2;
}

// AgentMappingView is one library mapping shown in both machines' terms.
message AgentMappingView {
  string scanner_slug = 1;
  string scan_type = 2;
  string server_path = 3;
  string agent_path = 4;
}

// AgentView is one agent as the UI sees it: what the operator configured,
// what the agent itself reports, and whether it is currently present.
message AgentView {
  string slug = 1;
  string display_name = 2;
  // online is presence, not health — true while the agent is still refreshing
  // its key.
  bool online = 3;
  // configured separates an agent that has announced itself from one someone
  // has actually set up.
  bool configured = 4;
  metarr.bus.v1.AgentIdentity identity = 5;
  metarr.bus.v1.AgentTelemetry telemetry = 6;
  google.protobuf.Timestamp reported_at = 7;
  repeated AgentMappingView mappings = 8;
  string log_level = 9;
}

message AgentServiceListRequest {}

message AgentServiceListResponse {
  repeated AgentView agents = 1;
}

message AgentServiceUpsertRequest {
  AgentConfig agent = 1;
}

message AgentServiceDeleteRequest {
  string slug = 1;
}

message AgentServiceSetLogLevelRequest {
  string slug = 1;
  string log_level = 2;
}

message AgentServiceStreamPresenceRequest {}

message AgentServiceStreamPresenceResponse {
  repeated AgentView agents = 1;
}

// AgentService is the config half of agent management: List merges configured
// agents with whoever is currently present in Redis. StreamPresence is the
// exact same merged view pushed continuously, replacing the agents.presence
// wsbus topic — reusing AgentView rather than an opaque payload since it's
// already fully modeled for List.
service AgentService {
  rpc List(AgentServiceListRequest) returns (AgentServiceListResponse);
  rpc StreamPresence(AgentServiceStreamPresenceRequest) returns (stream AgentServiceStreamPresenceResponse);
  rpc Upsert(AgentServiceUpsertRequest) returns (metarr.v1.AcceptedResponse);
  rpc Delete(AgentServiceDeleteRequest) returns (metarr.v1.AcceptedResponse);
  rpc SetLogLevel(AgentServiceSetLogLevelRequest) returns (metarr.v1.AcceptedResponse);
}

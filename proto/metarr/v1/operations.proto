syntax = "proto3";

package metarr.v1;

option go_package = "Metarr/internal/genproto/metarr/v1;metarrv1";

// Operation is Metarr's AIP-151 long-running-operation handle for the config
// API. Every config write returns one instead of the resource: the config
// store is event-sourced and eventually consistent (ADR-0002), so the durable
// write happens after the RPC returns, in the system_config_update listener.
//
// name is `operations/{correlation_id}` — the same correlation id the write
// stamps on its fired event, so no new identifier is minted. The operation
// starts done:false; the listener sets done:true once it has persisted, with
// `error` set on a persistence or late cross-entry-validation failure, or
// `response` set to the created resource's name for a minted-id Create (an
// Update or Delete leaves `response` empty).
//
// The shape mirrors google.longrunning.Operation but does not import it: that
// proto's Go binding pulls in google.golang.org/grpc and cloud.google.com/go,
// which this Connect-only codebase has no other use for, and its
// google.rpc.Status / google.protobuf.Any fields have no generated TypeScript
// unless the googleapis module is added to the generation target. `error` is a
// reduced {code, message} — the config API never fills google.rpc.Status
// details — and `response` is a resource name rather than a packed Any, which
// is all a minted-id Create client needs (it then reads the resource).
// `metadata` is omitted: the one first-party UI client polls to completion and
// never reads progress.
message Operation {
  string name = 1;
  bool done = 2;

  oneof result {
    OperationError error = 3;
    string response = 4;
  }
}

// OperationError is the failure of a completed Operation. code is a
// connect.Code / google.rpc.Code integer; message is safe to show an operator.
message OperationError {
  int32 code = 1;
  string message = 2;
}

message GetOperationRequest {
  // name is `operations/{correlation_id}`.
  string name = 1;
}

message ListOperationsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // filter is an AIP-160 expression; today only `done = true` / `done = false`
  // is honoured.
  string filter = 3;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
  string next_page_token = 2;
}

// OperationsService is the read side of the config API's long-running
// operations. Config operations are not cancellable — the write event is
// already in flight when the RPC returns — and completed records are reaped by
// a TTL on the store rather than an explicit delete, so `CancelOperation` /
// `DeleteOperation` / `WaitOperation` are deliberately absent rather than
// stubbed to Unimplemented.
service OperationsService {
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
}

syntax = "proto3";

package metarr.bus.v1;

import "google/protobuf/timestamp.proto";

option go_package = "Metarr/internal/genproto/metarr/bus/v1;busv1";

// The server<->agent contract messages: the presence record an agent writes
// to Redis every heartbeat, and the redacted configuration projection the
// server publishes for one agent. They are part of the language-agnostic
// bus contract (docs/adr/0008), so they live in metarr.bus.v1 rather than
// the internal metarr.v1 package alongside the CRUD services. The Go side
// aliases them through internal/shared/agentproto; the internal
// AgentService and DirectoryScannerService import this file for the shared
// shapes. See docs/adr/0005.

// GPUTelemetry is one GPU's live state.
message GPUTelemetry {
  string name = 1;
  double utilization_percent = 2;
  uint64 memory_used_bytes = 3;
  uint64 memory_total_bytes = 4;
}

// AgentTelemetry is the live host state, refreshed on every heartbeat.
message AgentTelemetry {
  double cpu_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  repeated GPUTelemetry gpus = 4;
}

// AgentIdentity is who and where an agent is. Collected once at startup, since
// none of it changes while the process lives.
message AgentIdentity {
  string slug = 1;
  // instance_id distinguishes one run of an agent from the next, so a restart
  // is visible as a restart rather than continuous uptime.
  string instance_id = 2;
  string hostname = 3;
  string ip = 4;
  // uid and username are the account the service runs as. uid is -1 on
  // Windows, which has no uid at all.
  int32 uid = 5;
  string username = 6;
  string os = 7;
  string arch = 8;
  string version = 9;
  google.protobuf.Timestamp started = 10;
}

// AgentPresence is the whole value stored at the agent's Redis presence key:
// identity plus a fresh telemetry sample, written by the agent every
// heartbeat with a TTL.
message AgentPresence {
  AgentIdentity identity = 1;
  AgentTelemetry telemetry = 2;
  google.protobuf.Timestamp reported_at = 3;
}

// SidecarTypeDefinition is one entry in the sidecar classification table.
// patterns are case-insensitive Go regexps matched against a file base name;
// extensions gates the match; order is the evaluation sequence, zero meaning
// disabled. It is in the bus contract because the agent receives it in its
// configuration projection and classifies files where they live.
message SidecarTypeDefinition {
  string id = 1;
  string type = 2;
  string category = 3;
  int32 order = 4;
  repeated string patterns = 5;
  repeated string extensions = 6;

  // Field 7 was name, a would-be AIP-122 resource name. The config CRUD
  // reshape (#77) addresses a sidecar type by its minted id alone — no
  // synthetic name (docs/adr/0010) — so the field was removed. Reserved so
  // the number is not reused.
  reserved 7;
  reserved "name";
}

// MappedDirectory is one scan directory as one agent sees it. The server's own
// path for the same library is deliberately absent — the agent has no use for
// it, and translating back is the server's job on the way in.
message MappedDirectory {
  string scanner_slug = 1;
  string scan_type = 2;
  string agent_path = 3;
}

// AgentConfigProjection is everything an agent is allowed to know — the
// redacted configuration the server publishes to the agent's Redis config
// key. It is the security boundary of the agent design: the application config
// it is derived from holds the admin password hash, every API key and every
// Sonarr credential, so this is built as an explicit allow-list rather than a
// copy-with-secrets-deleted. Adding a field here is a decision that every
// agent host may read it. See internal/server/agentregistry.BuildProjection.
message AgentConfigProjection {
  string slug = 1;
  string display_name = 2;
  // parallel_count is how many item directories the agent walks at once.
  int32 parallel_count = 3;
  // sidecar_types is the classification table; the agent holds it because
  // classification happens where the files are.
  repeated SidecarTypeDefinition sidecar_types = 4;
  // directories are only those mapped to this agent — it is told nothing
  // about libraries it cannot see.
  repeated MappedDirectory directories = 5;
  // log_level is this agent's own verbosity ("info" or "debug"). Not a
  // secret-boundary concern; it lives here because it is per-agent state
  // delivered the same way as everything else the agent needs.
  string log_level = 6;
  // updated_at lets the agent log which revision it is running, telling "the
  // mapping is wrong" apart from "the agent never got the new mapping".
  google.protobuf.Timestamp updated_at = 7;
}

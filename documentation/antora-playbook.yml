site:
  title: Metarr Documentation
  start_page: metarr::index.adoc

content:
  sources:
    # Paths are resolved against this file's directory; ./.. is the repo root.
    - url: ./..
      branches: HEAD
      start_path: documentation

ui:
  bundle:
    url: ./../documentation-theme/build/ui-bundle.zip
    # url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
    # supplemental_files: ../documentation-theme-supplemental-ui

output:
  dir: ./../build/site
  destinations:
    - provider: fs
    - provider: archive
      path: ./../build/site.zip

antora:
  # https://github.com/lask79/antora-shiki-extension
  # https://github.com/shikijs/shiki/
  extensions:
    - require: "@antora/lunr-extension"
    - require: "antora-shiki-extension"
      languages: # default: see this list
        - bash
        - console
        - js
        - shell
        - ruby
        - docker
        - yaml
        - go
        - json
        - proto
      use_line_numbers: true
      theme: solarized-dark
asciidoc:
  extensions:
    - "@asciidoctor/tabs"
    - "asciidoctor-kroki"
  attributes:
    kroki-fetch-diagram: true
    kroki-default-format: svg
    source-highlighter: shiki
runtime:
  log:
    level: info

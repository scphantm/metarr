  metadata.MovieFields:
    properties:
      countries:
        items:
          type: string
        type: array
      fanart:
        $ref: '#/definitions/metadata.Fanart'
      original_language:
        type: string
      set:
        $ref: '#/definitions/metadata.MovieSet'
      show_links:
        items:
          type: string
        type: array
      sort_title:
        type: string

basePath: /
definitions:
  appconfig.APIKeyEntry:
    properties:
      api_key:
        type: string
      name:
        type: string
    type: object
  appconfig.APIKeysConfig:
    properties:
      admin:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      read_only:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      user:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      webhook:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
    type: object
  appconfig.AdminUser:
    properties:
      email:
        type: string
      password_hash:
        type: string
      password_salt:
        type: string
      username:
        type: string
    type: object
  appconfig.Config:
    properties:
      admin:
        $ref: '#/definitions/appconfig.AdminUser'
      api_keys:
        $ref: '#/definitions/appconfig.APIKeysConfig'
      directory_scanner:
        $ref: '#/definitions/appconfig.DirectoryScannerConfig'
      interfaces:
        $ref: '#/definitions/appconfig.InterfacesConfig'
    type: object
  appconfig.DirectoryScannerConfig:
    properties:
      parallel_count:
        type: integer
      scan_directories:
        items:
          $ref: '#/definitions/appconfig.ScanDirectory'
        type: array
      sidecar_types:
        items:
          $ref: '#/definitions/appconfig.SidecarTypeDefinition'
        type: array
    type: object
  appconfig.InterfacesConfig:
    properties:
      sonarr:
        items:
          $ref: '#/definitions/appconfig.SonarrInstance'
        type: array
    type: object
  appconfig.RootDirMapping:
    properties:
      local_path:
        type: string
      sonarr_path:
        type: string
    type: object
  appconfig.ScanDirectory:
    properties:
      directory:
        type: string
      scan_type:
        type: string
      scanner_slug:
        type: string
    type: object
  appconfig.SidecarTypeDefinition:
    properties:
      category:
        type: string
      extensions:
        items:
          type: string
        type: array
      id:
        description: |-
          ID is the stable handle the config API edits an entry by. It is minted
          once and never reused, so an entry survives being renamed or retyped
          without losing its place in the evaluation sequence.
        type: string
      order:
        description: |-
          Order is the evaluation sequence: the scanner takes the first enabled
          entry that accepts a file, so narrower entries belong ahead of the
          catch-alls. Position in the stored array means nothing.

          Zero means the entry is disabled — kept in the table, still editable, but
          never evaluated. That is how a built-in type is switched off without
          losing its patterns.

          Order is changed only through the dedicated ordering endpoint, never by
          editing an entry, because uniqueness is a property of the whole table
          rather than of any one row.
        type: integer
      patterns:
        items:
          type: string
        type: array
      type:
        description: |-
          Type is what gets written onto every file classified as this kind, so it
          is unique across the table even though ID is the API's handle.
        type: string
    type: object
  appconfig.SonarrInstance:
    properties:
      instance_name:
        type: string
      instance_slug:
        type: string
      root_dir_map:
        items:
          $ref: '#/definitions/appconfig.RootDirMapping'
        type: array
      sonarr_api_key:
        type: string
      sonarr_url:
        type: string
      storage:
        $ref: '#/definitions/appconfig.StorageConfig'
    type: object
  appconfig.StorageConfig:
    properties:
      max_count:
        type: integer
      mode:
        type: string
      ttl:
        type: string
    type: object
  handlers.AcceptedResponse:
    properties:
      correlation_id:
        type: string
      event:
        type: string
      status:
        type: string
    type: object
  handlers.HeartbeatResponse:
    properties:
      correlation_id:
        type: string
      time:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      api_key:
        type: string
      expires_in_seconds:
        type: integer
    type: object
  handlers.LogoutResponse:
    properties:
      status:
        type: string
    type: object
  handlers.ReorderSidecarTypesRequest:
    additionalProperties:
      type: integer
    type: object
  handlers.TaskRequest:
    properties:
      command:
        type: string
    type: object
  handlers.UpdateAdminRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handlers.UpdateDirectoryScannerRequest:
    properties:
      parallel_count:
        type: integer
    type: object
  mediascan.AudioStream:
    properties:
      channels:
        type: string
      codec:
        type: string
      language:
        type: string
    type: object
  mediascan.DirectoryType:
    enum:
    - movie
    - tv
    - music_video
    type: string
    x-enum-varnames:
    - TypeMovie
    - TypeTV
    - TypeMusicVideo
  mediascan.FileInfo:
    properties:
      stream_details:
        $ref: '#/definitions/mediascan.StreamDetails'
    type: object
  mediascan.FileStat:
    properties:
      accessed_at:
        type: string
      block_size:
        type: integer
      blocks:
        type: integer
      changed_at:
        type: string
      created_at:
        description: |-
          CreatedAt is the file's birth time. It stays zero on Linux, which does
          not expose one through stat(2).
        type: string
      device_id:
        type: integer
      gid:
        type: integer
      group_name:
        type: string
      inode:
        type: integer
      is_symlink:
        description: |-
          IsSymlink reports that this record describes a symbolic link rather than
          the file it points at. The scan walks with lstat, so a symlinked sidecar
          reports the link's own stat and says so here instead of quietly reporting
          its target's.
        type: boolean
      link_count:
        type: integer
      mode:
        description: |-
          Mode is the symbolic rendering, "-rw-r--r--", and ModeBits the numeric
          permission bits alongside setuid, setgid and sticky — which is why the
          raw stat mode is masked rather than read through fs.FileMode.Perm, since
          that drops the three special bits.
        type: string
      mode_bits:
        type: integer
      modified_at:
        type: string
      owner_name:
        type: string
      size_bytes:
        type: integer
      uid:
        type: integer
    type: object
  mediascan.ImageInfo:
    properties:
      codec:
        type: string
      error:
        description: |-
          Error records why the header could not be read, for a file named like
          artwork that cannot be decoded. It is the only field set when it is set,
          so a corrupt poster stays distinguishable from one never examined.
        type: string
      height:
        type: integer
      width:
        type: integer
    type: object
  mediascan.MediaFile:
    properties:
      directory_id:
        type: string
      directory_path:
        type: string
      extension:
        type: string
      file_info:
        $ref: '#/definitions/mediascan.FileInfo'
      file_name:
        type: string
      id:
        type: string
      metadata:
        $ref: '#/definitions/metadata.Metadata'
      modified_at:
        type: string
      path:
        type: string
      record_type:
        $ref: '#/definitions/mediascan.RecordType'
      relative_path:
        type: string
      scan_root_path:
        type: string
      scanned_at:
        type: string
      sidecars:
        items:
          $ref: '#/definitions/mediascan.SidecarFile'
        type: array
      size_bytes:
        type: integer
      stat:
        allOf:
        - $ref: '#/definitions/mediascan.FileStat'
        description: |-
          Stat is the filesystem's view of the file — ownership, permissions, inode,
          timestamps — as recorded at scan time. FileInfo below is the codec's view;
          the two describe different things despite the similar names.
      type:
        $ref: '#/definitions/mediascan.DirectoryType'
      video:
        $ref: '#/definitions/metadata.VideoAttributes'
      warnings:
        items:
          type: string
        type: array
    type: object
  mediascan.RecordType:
    enum:
    - tvseries
    - media_file
    type: string
    x-enum-varnames:
    - RecordTypeTVSeries
    - RecordTypeMediaFile
  mediascan.SidecarCategory:
    enum:
    - image
    - video_extra
    - subtitle
    - metadata
    - audio
    - disc_structure
    - trickplay
    - unknown
    type: string
    x-enum-varnames:
    - SidecarCategoryImage
    - SidecarCategoryVideoExtra
    - SidecarCategorySubtitle
    - SidecarCategoryMetadata
    - SidecarCategoryAudio
    - SidecarCategoryDiscStructure
    - SidecarCategoryTrickplay
    - SidecarCategoryUnknown
  mediascan.SidecarFile:
    properties:
      category:
        $ref: '#/definitions/mediascan.SidecarCategory'
      extension:
        type: string
      file_name:
        type: string
      image:
        allOf:
        - $ref: '#/definitions/mediascan.ImageInfo'
        description: |-
          Image is the codec and dimensions read from the file's header, present
          only on sidecars whose extension marks them as artwork.
      modified_at:
        type: string
      relative_path:
        type: string
      sidecar_type:
        $ref: '#/definitions/mediascan.SidecarType'
      size_bytes:
        type: integer
      stat:
        allOf:
        - $ref: '#/definitions/mediascan.FileStat'
        description: |-
          Stat is what the filesystem reports about the file itself: ownership,
          permissions, inode and the full set of timestamps.
      trickplay:
        allOf:
        - $ref: '#/definitions/mediascan.TrickplayInfo'
        description: |-
          Trickplay places a scrubbing preview tile within its media file's
          previews, and is present only on those.
    type: object
  mediascan.SidecarType:
    enum:
    - poster
    - fanart
    - banner
    - clearlogo
    - clearart
    - discart
    - thumb
    - landscape
    - trailer
    - behind_the_scenes
    - deleted_scene
    - featurette
    - interview
    - scene
    - short
    - other_extra
    - subtitle
    - nfo
    - theme
    - disc_structure
    - trickplay
    - unknown
    type: string
    x-enum-varnames:
    - SidecarPoster
    - SidecarFanart
    - SidecarBanner
    - SidecarClearLogo
    - SidecarClearArt
    - SidecarDiscArt
    - SidecarThumb
    - SidecarLandscape
    - SidecarTrailer
    - SidecarBehindTheScenes
    - SidecarDeletedScene
    - SidecarFeaturette
    - SidecarInterview
    - SidecarScene
    - SidecarShort
    - SidecarOtherExtra
    - SidecarSubtitle
    - SidecarNFO
    - SidecarTheme
    - SidecarDiscStructure
    - SidecarTrickplay
    - SidecarUnknown
  mediascan.StreamDetails:
    properties:
      audio:
        items:
          $ref: '#/definitions/mediascan.AudioStream'
        type: array
      subtitle:
        items:
          $ref: '#/definitions/mediascan.SubtitleStream'
        type: array
      video:
        items:
          $ref: '#/definitions/mediascan.VideoStream'
        type: array
    type: object
  mediascan.SubtitleStream:
    properties:
      language:
        type: string
    type: object
  mediascan.TVSeason:
    properties:
      folder_name:
        type: string
      season_number:
        type: integer
      sidecars:
        items:
          $ref: '#/definitions/mediascan.SidecarFile'
        type: array
    type: object
  mediascan.TVSeries:
    properties:
      folder_name:
        type: string
      id:
        type: string
      metadata:
        $ref: '#/definitions/metadata.Metadata'
      path:
        type: string
      record_type:
        $ref: '#/definitions/mediascan.RecordType'
      scan_root_path:
        type: string
      scanned_at:
        type: string
      seasons:
        items:
          $ref: '#/definitions/mediascan.TVSeason'
        type: array
      sidecars:
        items:
          $ref: '#/definitions/mediascan.SidecarFile'
        type: array
      type:
        $ref: '#/definitions/mediascan.DirectoryType'
      warnings:
        items:
          type: string
        type: array
    type: object
  mediascan.TrickplayInfo:
    properties:
      tile_height:
        type: integer
      tile_index:
        description: |-
          TileIndex is nil for a file inside a resolution folder that is not a
          numbered tile, which is different from being the first one.
        type: integer
      tile_width:
        type: integer
      width:
        type: integer
    type: object
  mediascan.VideoStream:
    properties:
      aspect:
        type: string
      codec:
        type: string
      duration_in_seconds:
        type: string
      hdr_type:
        type: string
      height:
        type: string
      stereo_mode:
        type: string
      width:
        type: string
    type: object
  metadata.Actor:
    properties:
      name:
        type: string
      order:
        type: string
      role:
        type: string
      thumb:
        type: string
    type: object
  metadata.CastCrew:
    properties:
      actors:
        items:
          $ref: '#/definitions/metadata.Actor'
        type: array
      credits:
        items:
          type: string
        type: array
      directors:
        items:
          type: string
        type: array
    type: object
  metadata.DocumentKind:
    enum:
    - movie
    - tvshow
    - episodedetails
    - musicvideo
    - url
    - unknown
    type: string
    x-enum-varnames:
    - KindMovie
    - KindTVShow
    - KindEpisode
    - KindMusicVideo
    - KindURL
    - KindUnknown
  metadata.EpisodeBookmark:
    properties:
      position:
        type: string
    type: object
  metadata.EpisodeFields:
    properties:
      display_episode:
        type: string
      display_season:
        type: string
      episode:
        type: string
      episode_bookmark:
        $ref: '#/definitions/metadata.EpisodeBookmark'
      season:
        type: string
      show_title:
        type: string
    type: object
  metadata.Fanart:
    properties:
      thumbs:
        items:
          $ref: '#/definitions/metadata.Thumb'
        type: array
    type: object
  metadata.Link:
    properties:
      default:
        description: |-
          Default mirrors the default="true" attribute on a <uniqueid> tag, which
          names the provider a scraper treats as authoritative. Nothing in Metarr
          reads it yet; it is carried so a file we rewrite comes back as it went in.
        type: boolean
      key:
        type: string
      value:
        type: string
    type: object
  metadata.Metadata:
    properties:

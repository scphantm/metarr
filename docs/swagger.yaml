basePath: /
definitions:
  Metarr_internal_appconfig.Config:
    properties:
      interfaces:
        $ref: '#/definitions/Metarr_internal_appconfig.InterfacesConfig'
    type: object
  Metarr_internal_appconfig.InterfacesConfig:
    properties:
      sonarr:
        items:
          $ref: '#/definitions/Metarr_internal_appconfig.SonarrInstance'
        type: array
    type: object
  Metarr_internal_appconfig.RootDirMapping:
    properties:
      local_path:
        type: string
      sonarr_path:
        type: string
    type: object
  Metarr_internal_appconfig.SonarrInstance:
    properties:
      instance_name:
        type: string
      instance_slug:
        type: string
      root_dir_map:
        items:
          $ref: '#/definitions/Metarr_internal_appconfig.RootDirMapping'
        type: array
      sonarr_api_key:
        type: string
      sonarr_url:
        type: string
      storage:
        $ref: '#/definitions/Metarr_internal_appconfig.StorageConfig'
    type: object
  Metarr_internal_appconfig.StorageConfig:
    properties:
      mode:
        type: string
      ttl:
        type: string
    type: object
  internal_handlers.HeartbeatResponse:
    properties:
      correlation_id:
        type: string
      time:
        type: string
    type: object
  internal_handlers.acceptedResponse:
    properties:
      correlation_id:
        type: string
      event:
        type: string
      status:
        type: string
    type: object
  internal_handlers.taskRequest:
    properties:
      command:
        type: string
    type: object
info:
  contact: {}
  description: Event-driven Go API backed by MongoDB and Redis. Every request carries
    a correlation ID (X-Correlation-ID), generated by the server if the caller doesn't
    supply one.
  title: Metarr API
  version: "1.0"
paths:
  /api/config:
    get:
      description: Reads the singleton application config document from MongoDB.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Metarr_internal_appconfig.Config'
      summary: Fetch the application config
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Fires a system_config_update event with the updated document as
        its payload and returns as soon as the event has been queued. The SystemConfigUpdate
        listener persists the change to MongoDB and then refreshes the in-memory config
        singleton.
      parameters:
      - description: Updated application config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Metarr_internal_appconfig.Config'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_handlers.acceptedResponse'
        "400":
          description: invalid request body
          schema:
            type: string
      summary: Update the application config
      tags:
      - Config
  /api/heartbeat:
    get:
      description: Publishes a heartbeat request on the Redis Pub/Sub queue and blocks
        until the heartbeat listener replies with the current time and the request's
        correlation ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.HeartbeatResponse'
        "504":
          description: heartbeat timed out
          schema:
            type: string
      summary: Blocking heartbeat check
      tags:
      - Heartbeat
  /api/tasks/sonarr_cache_data:
    post:
      consumes:
      - application/json
      description: Fires the sonarr_cache_data event onto the durable event stream
        in a non-blocking way and returns as soon as the event has been queued.
      parameters:
      - description: Command to run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.taskRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_handlers.acceptedResponse'
        "400":
          description: invalid request body or unsupported command
          schema:
            type: string
      summary: Trigger the sonarr_cache_data background job
      tags:
      - Tasks
swagger: "2.0"

        type: string
      cast_crew:
        $ref: '#/definitions/metadata.CastCrew'
      code:
        type: string
      date_added:
        $ref: '#/definitions/types.Date'
      episode:
        $ref: '#/definitions/metadata.EpisodeFields'
      external_links:
        items:
          $ref: '#/definitions/metadata.Link'
        type: array
      extra:
        items:
          $ref: '#/definitions/metadata.UnknownElement'
        type: array
      genres:
        items:
          type: string
        type: array
      id:
        type: string
      kind:
        $ref: '#/definitions/metadata.DocumentKind'
      last_played:
        type: string
      movie:
        $ref: '#/definitions/metadata.MovieFields'
      mpaa:
        type: string
      musicvideo:
        $ref: '#/definitions/metadata.MusicVideoFields'
      original_title:
        type: string
      outline:
        type: string
      parse_error:
        description: |-
          ParseError records why an NFO could not be read. A malformed sidecar is
          reported here rather than failing the scan.
        type: string
      play_count:
        type: integer
      plot:
        type: string
      premiered:
        $ref: '#/definitions/types.Date'
      ratings:
        $ref: '#/definitions/metadata.Ratings'
      resume:
        $ref: '#/definitions/metadata.Resume'
      runtime:
        type: string
      scope:
        type: string
      status:
        type: string
      studios:
        items:
          type: string
        type: array
      tagline:
        type: string
      tags:
        items:
          type: string
        type: array
      target_base_name:
        type: string
      thumbs:
        items:
          $ref: '#/definitions/metadata.Thumb'
        type: array
      title:
        type: string
      top250:
        type: string
      trailer:
        type: string
      tvshow:
        $ref: '#/definitions/metadata.TVShowFields'
      user_rating:
        type: string
      year:
        type: integer

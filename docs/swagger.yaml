basePath: /
definitions:
  appconfig.APIKeyEntry:
    properties:
      api_key:
        type: string
      name:
        type: string
    type: object
  appconfig.APIKeysConfig:
    properties:
      admin:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      read_only:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      user:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      webhook:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
    type: object
  appconfig.AdminUser:
    properties:
      email:
        type: string
      username:
        type: string
    type: object
  appconfig.Config:
    properties:
      admin:
        $ref: '#/definitions/appconfig.AdminUser'
      api_keys:
        $ref: '#/definitions/appconfig.APIKeysConfig'
      interfaces:
        $ref: '#/definitions/appconfig.InterfacesConfig'
    type: object
  appconfig.InterfacesConfig:
    properties:
      sonarr:
        items:
          $ref: '#/definitions/appconfig.SonarrInstance'
        type: array
    type: object
  appconfig.RootDirMapping:
    properties:
      local_path:
        type: string
      sonarr_path:
        type: string
    type: object
  appconfig.SonarrInstance:
    properties:
      instance_name:
        type: string
      instance_slug:
        type: string
      root_dir_map:
        items:
          $ref: '#/definitions/appconfig.RootDirMapping'
        type: array
      sonarr_api_key:
        type: string
      sonarr_url:
        type: string
      storage:
        $ref: '#/definitions/appconfig.StorageConfig'
    type: object
  appconfig.StorageConfig:
    properties:
      max_count:
        type: integer
      mode:
        type: string
      ttl:
        type: string
    type: object
  handlers.HeartbeatResponse:
    properties:
      correlation_id:
        type: string
      time:
        type: string
    type: object
  handlers.acceptedResponse:
    properties:
      correlation_id:
        type: string
      event:
        type: string
      status:
        type: string
    type: object
  handlers.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.loginResponse:
    properties:
      api_key:
        type: string
      expires_in_seconds:
        type: integer
    type: object
  handlers.logoutResponse:
    properties:
      status:
        type: string
    type: object
  handlers.taskRequest:
    properties:
      command:
        type: string
    type: object
  handlers.updateAdminRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Event-driven Go API backed by MongoDB and Redis. Every request carries
    a correlation ID (X-Correlation-ID), generated by the server if the caller doesn't
    supply one.
  title: Metarr API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Compares the submitted username/password against the stored admin
        credentials and issues a session API key carrying admin rights.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.loginResponse'
        "400":
          description: invalid request body
          schema:
            type: string
        "401":
          description: invalid username or password
          schema:
            type: string
      summary: Log in as the admin user
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Revokes the session API key that authenticated this request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.logoutResponse'
      summary: Log out
      tags:
      - Auth
  /api/config:
    get:
      description: Reads the singleton application config document from MongoDB.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.Config'
      summary: Fetch the application config
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Fires a system_config_update event with the updated document as
        its payload and returns as soon as the event has been queued. The SystemConfigUpdate
        listener persists the change to MongoDB and then refreshes the in-memory config
        singleton.
      parameters:
      - description: Updated application config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.Config'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.acceptedResponse'
        "400":
          description: invalid request body
          schema:
            type: string
      summary: Update the application config
      tags:
      - Config
  /api/config/admin:
    put:
      consumes:
      - application/json
      description: Updates any subset of the admin user's username, email, and password.
        A provided field cannot be empty. If password is set, it is re-hashed with
        a fresh salt.
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.updateAdminRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.acceptedResponse'
        "400":
          description: invalid request body, or a provided field was empty
          schema:
            type: string
      summary: Update the admin user's credentials
      tags:
      - Config
  /api/config/interfaces/sonarr:
    get:
      description: Reads the application config from MongoDB and returns every configured
        Sonarr instance.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appconfig.SonarrInstance'
            type: array
      summary: List Sonarr interface instances
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: Adds a new Sonarr instance. instance_slug is required and must
        be unique across every interface type.
      parameters:
      - description: New Sonarr instance
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.SonarrInstance'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.acceptedResponse'
        "400":
          description: invalid request body or missing instance_slug
          schema:
            type: string
        "409":
          description: instance_slug already in use
          schema:
            type: string
      summary: Create a Sonarr interface instance
      tags:
      - Config
  /api/config/interfaces/sonarr/{slug}:
    delete:
      description: Removes the Sonarr instance with the given instance_slug and fires
        system_config_update with the resulting document.
      parameters:
      - description: instance_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.acceptedResponse'
        "404":
          description: no Sonarr instance with that slug
          schema:
            type: string
      summary: Delete a Sonarr interface instance
      tags:
      - Config
    get:
      description: Reads the application config from MongoDB and returns the Sonarr
        instance with the given instance_slug.
      parameters:
      - description: instance_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.SonarrInstance'
        "404":
          description: no Sonarr instance with that slug
          schema:
            type: string
      summary: Fetch a single Sonarr interface instance
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Replaces every field of the Sonarr instance at the given instance_slug
        except instance_slug itself, which cannot be changed once set.
      parameters:
      - description: instance_slug
        in: path
        name: slug
        required: true
        type: string
      - description: Updated Sonarr instance
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.SonarrInstance'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.acceptedResponse'
        "400":
          description: invalid request body, or attempted to change instance_slug
          schema:
            type: string
        "404":
          description: no Sonarr instance with that slug
          schema:
            type: string
      summary: Update a Sonarr interface instance
      tags:
      - Config
  /api/heartbeat:
    get:
      description: Publishes a heartbeat request on the Redis Pub/Sub queue and blocks
        until the heartbeat listener replies with the current time and the request's
        correlation ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HeartbeatResponse'
        "504":
          description: heartbeat timed out
          schema:
            type: string
      summary: Blocking heartbeat check
      tags:
      - Heartbeat
  /api/tasks/sonarr_cache_data:
    post:
      consumes:
      - application/json
      description: Fires the sonarr_cache_data event onto the durable event stream
        in a non-blocking way and returns as soon as the event has been queued.
      parameters:
      - description: Command to run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.taskRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.acceptedResponse'
        "400":
          description: invalid request body or unsupported command
          schema:
            type: string
      summary: Trigger the sonarr_cache_data background job
      tags:
      - Tasks
swagger: "2.0"

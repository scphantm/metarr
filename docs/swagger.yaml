basePath: /
definitions:
  agentproto.AgentIdentity:
    properties:
      arch:
        type: string
      hostname:
        type: string
      instance_id:
        description: |-
          InstanceID distinguishes one run of an agent from the next. It is what
          makes a restart visible as a restart rather than as continuous uptime.
        type: string
      ip:
        type: string
      os:
        type: string
      slug:
        type: string
      started:
        type: string
      uid:
        description: |-
          UID and Username are the account the service runs as — the thing that
          decides whether it can actually read the library it was pointed at.
        type: integer
      username:
        type: string
      version:
        type: string
    type: object
  agentproto.AgentTelemetry:
    properties:
      cpu_percent:
        type: number
      gpus:
        description: |-
          GPUs is empty on a host without one, which is the common case and not a
          failure. A host whose GPU cannot be queried also reports none rather
          than failing the heartbeat around it.
        items:
          $ref: '#/definitions/agentproto.GPUTelemetry'
        type: array
      memory_total_bytes:
        type: integer
      memory_used_bytes:
        type: integer
    type: object
  agentproto.GPUTelemetry:
    properties:
      memory_total_bytes:
        type: integer
      memory_used_bytes:
        type: integer
      name:
        type: string
      utilization_percent:
        type: number
    type: object
  agentregistry.AgentView:
    properties:
      configured:
        description: |-
          Configured separates an agent that has announced itself from one someone
          has actually set up. An agent that is online but not configured is the
          state every new agent starts in, and the one the UI has to surface.
        type: boolean
      display_name:
        type: string
      identity:
        $ref: '#/definitions/agentproto.AgentIdentity'
      log_level:
        description: |-
          LogLevel is this agent's current verbosity, defaulted the same way
          BuildProjection defaults it — so the Logging screen's toggle always has
          a real value to show, never an empty string, even for an agent nobody
          has touched yet.
        type: string
      mappings:
        description: |-
          Mappings is what this agent has been told it can see, in the server's own
          terms as well as the agent's, since the UI shows both.
        items:
          $ref: '#/definitions/agentregistry.MappingView'
        type: array
      online:
        description: |-
          Online is presence, not health. It is true while the agent is still
          refreshing its key, which is the only thing the server can actually know
          about a machine it does not control.
        type: boolean
      reported_at:
        type: string
      slug:
        type: string
      telemetry:
        $ref: '#/definitions/agentproto.AgentTelemetry'
    type: object
  agentregistry.MappingView:
    properties:
      agent_path:
        type: string
      scan_type:
        type: string
      scanner_slug:
        type: string
      server_path:
        type: string
    type: object
  appconfig.APIKeyEntry:
    properties:
      api_key:
        type: string
      name:
        type: string
    type: object
  appconfig.APIKeysConfig:
    properties:
      admin:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      read_only:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      user:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
      webhook:
        items:
          $ref: '#/definitions/appconfig.APIKeyEntry'
        type: array
    type: object
  appconfig.AdminUser:
    properties:
      email:
        type: string
      password_hash:
        type: string
      password_salt:
        type: string
      username:
        type: string
    type: object
  appconfig.AgentConfig:
    properties:
      display_name:
        type: string
      log_level:
        description: |-
          LogLevel is this agent's own verbosity, set from the System > Logging
          screen. Empty means LogLevelInfo — most agents never need touching, so
          storing a default rather than requiring every entry to set it keeps a
          bare {slug, mappings} entry valid.
        type: string
      mappings:
        description: |-
          Mappings say which libraries this agent can see and where. A scan
          directory absent from this list is one the agent has no access to,
          which is normal: agents sit on different machines holding different
          storage.
        items:
          $ref: '#/definitions/appconfig.AgentDirectoryMapping'
        type: array
      slug:
        description: |-
          Slug matches the slug the agent is configured with locally, and is the
          only link between the two. It has to be unique, which the API enforces.
        type: string
    type: object
  appconfig.AgentDirectoryMapping:
    properties:
      agent_path:
        type: string
      scanner_slug:
        type: string
    type: object
  appconfig.Config:
    properties:
      admin:
        $ref: '#/definitions/appconfig.AdminUser'
      agents:
        items:
          $ref: '#/definitions/appconfig.AgentConfig'
        type: array
      api_keys:
        $ref: '#/definitions/appconfig.APIKeysConfig'
      directory_scanner:
        $ref: '#/definitions/appconfig.DirectoryScannerConfig'
      interfaces:
        $ref: '#/definitions/appconfig.InterfacesConfig'
      logging:
        $ref: '#/definitions/appconfig.LoggingConfig'
    type: object
  appconfig.DirectoryScannerConfig:
    properties:
      parallel_count:
        type: integer
      scan_directories:
        items:
          $ref: '#/definitions/appconfig.ScanDirectory'
        type: array
      sidecar_types:
        items:
          $ref: '#/definitions/appconfig.SidecarTypeDefinition'
        type: array
    type: object
  appconfig.InterfacesConfig:
    properties:
      sonarr:
        items:
          $ref: '#/definitions/appconfig.SonarrInstance'
        type: array
    type: object
  appconfig.LoggingConfig:
    properties:
      endpoint:
        type: string
      server_level:
        type: string
      sink:
        type: string
      stream:
        type: string
    type: object
  appconfig.RootDirMapping:
    properties:
      local_path:
        type: string
      sonarr_path:
        type: string
    type: object
  appconfig.ScanDirectory:
    properties:
      directory:
        type: string
      scan_type:
        type: string
      scanner_slug:
        type: string
    type: object
  appconfig.SidecarTypeDefinition:
    properties:
      category:
        type: string
      extensions:
        items:
          type: string
        type: array
      id:
        description: |-
          ID is the stable handle the config API edits an entry by. It is minted
          once and never reused, so an entry survives being renamed or retyped
          without losing its place in the evaluation sequence.
        type: string
      order:
        description: |-
          Order is the evaluation sequence: the scanner takes the first enabled
          entry that accepts a file, so narrower entries belong ahead of the
          catch-alls. Position in the stored array means nothing.

          Zero means the entry is disabled — kept in the table, still editable, but
          never evaluated. That is how a built-in type is switched off without
          losing its patterns.

          Order is changed only through the dedicated ordering endpoint, never by
          editing an entry, because uniqueness is a property of the whole table
          rather than of any one row.
        type: integer
      patterns:
        items:
          type: string
        type: array
      type:
        description: |-
          Type is what gets written onto every file classified as this kind, so it
          is unique across the table even though ID is the API's handle.
        type: string
    type: object
  appconfig.SonarrInstance:
    properties:
      instance_name:
        type: string
      instance_slug:
        type: string
      root_dir_map:
        items:
          $ref: '#/definitions/appconfig.RootDirMapping'
        type: array
      sonarr_api_key:
        type: string
      sonarr_url:
        type: string
      storage:
        $ref: '#/definitions/appconfig.StorageConfig'
    type: object
  appconfig.StorageConfig:
    properties:
      max_count:
        type: integer
      mode:
        type: string
      ttl:
        type: string
    type: object
  bson.M:
    additionalProperties: {}
    type: object
  handlers.AcceptedResponse:
    properties:
      correlation_id:
        type: string
      event:
        type: string
      status:
        type: string
    type: object
  handlers.HeartbeatResponse:
    properties:
      correlation_id:
        type: string
      time:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      api_key:
        type: string
      expires_in_seconds:
        type: integer
    type: object
  handlers.LogoutResponse:
    properties:
      status:
        type: string
    type: object
  handlers.ReorderSidecarTypesRequest:
    additionalProperties:
      type: integer
    type: object
  handlers.TaskRequest:
    properties:
      command:
        type: string
    type: object
  handlers.UpdateAdminRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handlers.UpdateDirectoryScannerRequest:
    properties:
      parallel_count:
        type: integer
    type: object
  handlers.WorkflowListResponse:
    properties:
      has_more:
        type: boolean
      next_cursor:
        type: string
      workflows:
        items:
          $ref: '#/definitions/mongostore.Workflow'
        type: array
    type: object
  handlers.setAgentLogLevelRequest:
    properties:
      log_level:
        type: string
    type: object
  logging.Record:
    properties:
      attrs:
        additionalProperties: {}
        type: object
      level:
        type: string
      message:
        type: string
      source:
        type: string
      time:
        type: string
    type: object
  metadata.Actor:
    properties:
      name:
        type: string
      order:
        type: string
      role:
        type: string
      thumb:
        type: string
    type: object
  metadata.CastCrew:
    properties:
      actors:
        items:
          $ref: '#/definitions/metadata.Actor'
        type: array
      credits:
        items:
          type: string
        type: array
      directors:
        items:
          type: string
        type: array
    type: object
  metadata.DocumentKind:
    enum:
    - movie
    - tvshow
    - episodedetails
    - musicvideo
    - url
    - unknown
    type: string
    x-enum-varnames:
    - KindMovie
    - KindTVShow
    - KindEpisode
    - KindMusicVideo
    - KindURL
    - KindUnknown
  metadata.EpisodeBookmark:
    properties:
      position:
        type: string
    type: object
  metadata.EpisodeFields:
    properties:
      display_episode:
        type: string
      display_season:
        type: string
      episode:
        type: string
      episode_bookmark:
        $ref: '#/definitions/metadata.EpisodeBookmark'
      season:
        type: string
      show_title:
        type: string
    type: object
  metadata.Fanart:
    properties:
      thumbs:
        items:
          $ref: '#/definitions/metadata.Thumb'
        type: array
    type: object
  metadata.Link:
    properties:
      default:
        description: |-
          Default mirrors the default="true" attribute on a <uniqueid> tag, which
          names the provider a scraper treats as authoritative. Nothing in Metarr
          reads it yet; it is carried so a file we rewrite comes back as it went in.
        type: boolean
      key:
        type: string
      value:
        type: string
    type: object
  metadata.Metadata:
    properties:
      aired:
        type: string
      cast_crew:
        $ref: '#/definitions/metadata.CastCrew'
      code:
        type: string
      date_added:
        $ref: '#/definitions/types.Date'
      episode:
        $ref: '#/definitions/metadata.EpisodeFields'
      external_links:
        items:
          $ref: '#/definitions/metadata.Link'
        type: array
      extra:
        items:
          $ref: '#/definitions/metadata.UnknownElement'
        type: array
      genres:
        items:
          type: string
        type: array
      id:
        type: string
      kind:
        $ref: '#/definitions/metadata.DocumentKind'
      last_played:
        type: string
      movie:
        $ref: '#/definitions/metadata.MovieFields'
      mpaa:
        type: string
      musicvideo:
        $ref: '#/definitions/metadata.MusicVideoFields'
      original_title:
        type: string
      outline:
        type: string
      parse_error:
        description: |-
          ParseError records why an NFO could not be read. A malformed sidecar is
          reported here rather than failing the scan.
        type: string
      play_count:
        type: integer
      plot:
        type: string
      premiered:
        $ref: '#/definitions/types.Date'
      ratings:
        $ref: '#/definitions/metadata.Ratings'
      resume:
        $ref: '#/definitions/metadata.Resume'
      runtime:
        type: string
      scope:
        type: string
      status:
        type: string
      studios:
        items:
          type: string
        type: array
      tagline:
        type: string
      tags:
        items:
          type: string
        type: array
      target_base_name:
        type: string
      thumbs:
        items:
          $ref: '#/definitions/metadata.Thumb'
        type: array
      title:
        type: string
      top250:
        type: string
      trailer:
        type: string
      tvshow:
        $ref: '#/definitions/metadata.TVShowFields'
      user_rating:
        type: string
      year:
        type: integer
    type: object
  metadata.MovieFields:
    properties:
      countries:
        items:
          type: string
        type: array
      fanart:
        $ref: '#/definitions/metadata.Fanart'
      original_language:
        type: string
      set:
        $ref: '#/definitions/metadata.MovieSet'
      show_links:
        items:
          type: string
        type: array
      sort_title:
        type: string
    type: object
  metadata.MovieSet:
    properties:
      name:
        type: string
      overview:
        type: string
    type: object
  metadata.MusicVideoFields:
    properties:
      album:
        type: string
      artists:
        items:
          type: string
        type: array
      track:
        type: string
    type: object
  metadata.Rating:
    properties:
      default:
        type: boolean
      max:
        type: string
      name:
        type: string
      value:
        type: string
      votes:
        type: string
    type: object
  metadata.Ratings:
    properties:
      rating:
        items:
          $ref: '#/definitions/metadata.Rating'
        type: array
    type: object
  metadata.Resume:
    properties:
      position:
        type: string
      total:
        type: string
    type: object
  metadata.SeasonSummary:
    properties:
      folder_name:
        type: string
      named_season:
        type: string
      season_number:
        type: integer
      season_plot:
        type: string
    type: object
  metadata.TVShowFields:
    properties:
      seasons:
        items:
          $ref: '#/definitions/metadata.SeasonSummary'
        type: array
    type: object
  metadata.Thumb:
    properties:
      aspect:
        type: string
      preview:
        type: string
      season:
        type: string
      type:
        type: string
      value:
        type: string
    type: object
  metadata.UnknownElement:
    properties:
      attrs:
        items:
          $ref: '#/definitions/xml.Attr'
        type: array
      inner_xml:
        type: string
      name:
        type: string
    type: object
  metadata.VideoAttributes:
    properties:
      air_date:
        $ref: '#/definitions/types.Date'
      edition:
        type: string
      episode_numbers:
        items:
          type: integer
        type: array
      episode_title:
        type: string
      extra_source:
        type: string
      extra_type:
        description: ExtraType and ExtraSource are set only on extra videos.
        type: string
      is_special:
        type: boolean
      season_number:
        description: |-
          SeasonNumber is nil when it could not be resolved, which is different
          from season zero (specials).
        type: integer
      stack_number:
        type: integer
      stack_type:
        type: string
      three_d_format:
        type: string
      title:
        type: string
      version_label:
        type: string
      year:
        type: integer
    type: object
  mongostore.Workflow:
    properties:
      created_at:
        type: string
      description:
        type: string
      document_id:
        type: string
      edges:
        items:
          $ref: '#/definitions/bson.M'
        type: array
      id:
        type: string
      name:
        type: string
      nodes:
        description: |-
          React Flow's own toObject() shape, stored as-is and re-rendered with
          whatever the current node/edge components are. Deliberately untyped
          (bson.M, not a Go struct): the node/edge schema is still being
          designed on the frontend and is expected to keep changing without a
          backend release in lockstep — see the no-migration-logic note on
          reading old versions.
        items:
          $ref: '#/definitions/bson.M'
        type: array
      tags:
        items:
          type: string
        type: array
      version:
        type: integer
      viewport:
        $ref: '#/definitions/bson.M'
    type: object
  redisstats.ChannelStat:
    properties:
      channel:
        type: string
      known:
        description: |-
          Known marks the application's declared channels. Channels discovered
          at runtime — the per-correlation-id reply channels — come back false,
          since they exist only while a request is in flight.
        type: boolean
      subscribers:
        type: integer
    type: object
  redisstats.ConsumerStat:
    properties:
      idle_seconds:
        type: integer
      name:
        type: string
      pending:
        type: integer
    type: object
  redisstats.GroupStat:
    properties:
      consumer_detail:
        items:
          $ref: '#/definitions/redisstats.ConsumerStat'
        type: array
      consumers:
        type: integer
      lag:
        type: integer
      last_delivered_id:
        type: string
      name:
        type: string
      pending:
        type: integer
    type: object
  redisstats.ServerInfo:
    properties:
      connected_clients:
        type: integer
      ops_per_second:
        type: integer
      total_keys:
        type: integer
      uptime_seconds:
        type: integer
      used_memory:
        type: integer
      used_memory_human:
        type: string
      version:
        type: string
    type: object
  redisstats.Snapshot:
    properties:
      collected_at:
        type: string
      pubsub:
        items:
          $ref: '#/definitions/redisstats.ChannelStat'
        type: array
      server:
        $ref: '#/definitions/redisstats.ServerInfo'
      streams:
        items:
          $ref: '#/definitions/redisstats.StreamStat'
        type: array
    type: object
  redisstats.StreamStat:
    properties:
      error:
        description: |-
          Error records a per-stream failure. One unreadable stream should not
          cost the caller the rest of the snapshot.
        type: string
      event_name:
        type: string
      exists:
        description: |-
          Exists distinguishes an empty stream from one that has never been
          created. Streams are created lazily, when a listener first subscribes,
          so a length of zero on its own is ambiguous.
        type: boolean
      groups:
        items:
          $ref: '#/definitions/redisstats.GroupStat'
        type: array
      length:
        type: integer
      stream:
        type: string
    type: object
  scanmodel.AudioStream:
    properties:
      channels:
        type: string
      codec:
        type: string
      language:
        type: string
    type: object
  scanmodel.DirectoryType:
    enum:
    - movie
    - tv
    - music_video
    type: string
    x-enum-varnames:
    - TypeMovie
    - TypeTV
    - TypeMusicVideo
  scanmodel.FileInfo:
    properties:
      stream_details:
        $ref: '#/definitions/scanmodel.StreamDetails'
    type: object
  scanmodel.FileStat:
    properties:
      accessed_at:
        type: string
      block_size:
        type: integer
      blocks:
        type: integer
      changed_at:
        type: string
      created_at:
        description: |-
          CreatedAt is the file's birth time. It stays zero on Linux, which does
          not expose one through stat(2).
        type: string
      device_id:
        type: integer
      gid:
        type: integer
      group_name:
        type: string
      inode:
        type: integer
      is_symlink:
        description: |-
          IsSymlink reports that this record describes a symbolic link rather than
          the file it points at. The scan walks with lstat, so a symlinked sidecar
          reports the link's own stat and says so here instead of quietly reporting
          its target's.
        type: boolean
      link_count:
        type: integer
      mode:
        description: |-
          Mode is the symbolic rendering, "-rw-r--r--", and ModeBits the numeric
          permission bits alongside setuid, setgid and sticky — which is why the
          raw stat mode is masked rather than read through fs.FileMode.Perm, since
          that drops the three special bits.
        type: string
      mode_bits:
        type: integer
      modified_at:
        type: string
      owner_name:
        type: string
      size_bytes:
        type: integer
      uid:
        type: integer
    type: object
  scanmodel.ImageInfo:
    properties:
      codec:
        type: string
      error:
        description: |-
          Error records why the header could not be read, for a file named like
          artwork that cannot be decoded. It is the only field set when it is set,
          so a corrupt poster stays distinguishable from one never examined.
        type: string
      height:
        type: integer
      width:
        type: integer
    type: object
  scanmodel.MediaFile:
    properties:
      directory_id:
        type: string
      directory_path:
        type: string
      extension:
        type: string
      file_info:
        $ref: '#/definitions/scanmodel.FileInfo'
      file_name:
        type: string
      id:
        type: string
      metadata:
        $ref: '#/definitions/metadata.Metadata'
      modified_at:
        type: string
      path:
        type: string
      record_type:
        $ref: '#/definitions/scanmodel.RecordType'
      relative_path:
        type: string
      scan_root_path:
        type: string
      scanned_at:
        type: string
      sidecars:
        items:
          $ref: '#/definitions/scanmodel.SidecarFile'
        type: array
      size_bytes:
        type: integer
      stat:
        allOf:
        - $ref: '#/definitions/scanmodel.FileStat'
        description: |-
          Stat is the filesystem's view of the file — ownership, permissions, inode,
          timestamps — as recorded at scan time. FileInfo below is the codec's view;
          the two describe different things despite the similar names.
      type:
        $ref: '#/definitions/scanmodel.DirectoryType'
      video:
        $ref: '#/definitions/metadata.VideoAttributes'
      warnings:
        items:
          type: string
        type: array
    type: object
  scanmodel.RecordType:
    enum:
    - tvseries
    - media_file
    type: string
    x-enum-varnames:
    - RecordTypeTVSeries
    - RecordTypeMediaFile
  scanmodel.SidecarCategory:
    enum:
    - image
    - video_extra
    - subtitle
    - metadata
    - audio
    - disc_structure
    - trickplay
    - unknown
    type: string
    x-enum-varnames:
    - SidecarCategoryImage
    - SidecarCategoryVideoExtra
    - SidecarCategorySubtitle
    - SidecarCategoryMetadata
    - SidecarCategoryAudio
    - SidecarCategoryDiscStructure
    - SidecarCategoryTrickplay
    - SidecarCategoryUnknown
  scanmodel.SidecarFile:
    properties:
      category:
        $ref: '#/definitions/scanmodel.SidecarCategory'
      extension:
        type: string
      file_name:
        type: string
      image:
        allOf:
        - $ref: '#/definitions/scanmodel.ImageInfo'
        description: |-
          Image is the codec and dimensions read from the file's header, present
          only on sidecars whose extension marks them as artwork.
      modified_at:
        type: string
      relative_path:
        type: string
      sidecar_type:
        $ref: '#/definitions/scanmodel.SidecarType'
      size_bytes:
        type: integer
      stat:
        allOf:
        - $ref: '#/definitions/scanmodel.FileStat'
        description: |-
          Stat is what the filesystem reports about the file itself: ownership,
          permissions, inode and the full set of timestamps.
      trickplay:
        allOf:
        - $ref: '#/definitions/scanmodel.TrickplayInfo'
        description: |-
          Trickplay places a scrubbing preview tile within its media file's
          previews, and is present only on those.
    type: object
  scanmodel.SidecarType:
    enum:
    - poster
    - fanart
    - banner
    - clearlogo
    - clearart
    - discart
    - thumb
    - landscape
    - trailer
    - behind_the_scenes
    - deleted_scene
    - featurette
    - interview
    - scene
    - short
    - other_extra
    - subtitle
    - nfo
    - theme
    - disc_structure
    - trickplay
    - unknown
    type: string
    x-enum-varnames:
    - SidecarPoster
    - SidecarFanart
    - SidecarBanner
    - SidecarClearLogo
    - SidecarClearArt
    - SidecarDiscArt
    - SidecarThumb
    - SidecarLandscape
    - SidecarTrailer
    - SidecarBehindTheScenes
    - SidecarDeletedScene
    - SidecarFeaturette
    - SidecarInterview
    - SidecarScene
    - SidecarShort
    - SidecarOtherExtra
    - SidecarSubtitle
    - SidecarNFO
    - SidecarTheme
    - SidecarDiscStructure
    - SidecarTrickplay
    - SidecarUnknown
  scanmodel.StreamDetails:
    properties:
      audio:
        items:
          $ref: '#/definitions/scanmodel.AudioStream'
        type: array
      subtitle:
        items:
          $ref: '#/definitions/scanmodel.SubtitleStream'
        type: array
      video:
        items:
          $ref: '#/definitions/scanmodel.VideoStream'
        type: array
    type: object
  scanmodel.SubtitleStream:
    properties:
      language:
        type: string
    type: object
  scanmodel.TVSeason:
    properties:
      folder_name:
        type: string
      season_number:
        type: integer
      sidecars:
        items:
          $ref: '#/definitions/scanmodel.SidecarFile'
        type: array
    type: object
  scanmodel.TVSeries:
    properties:
      folder_name:
        type: string
      id:
        type: string
      metadata:
        $ref: '#/definitions/metadata.Metadata'
      path:
        type: string
      record_type:
        $ref: '#/definitions/scanmodel.RecordType'
      scan_root_path:
        type: string
      scanned_at:
        type: string
      seasons:
        items:
          $ref: '#/definitions/scanmodel.TVSeason'
        type: array
      sidecars:
        items:
          $ref: '#/definitions/scanmodel.SidecarFile'
        type: array
      type:
        $ref: '#/definitions/scanmodel.DirectoryType'
      warnings:
        items:
          type: string
        type: array
    type: object
  scanmodel.TrickplayInfo:
    properties:
      tile_height:
        type: integer
      tile_index:
        description: |-
          TileIndex is nil for a file inside a resolution folder that is not a
          numbered tile, which is different from being the first one.
        type: integer
      tile_width:

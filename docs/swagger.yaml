  types.Date:
    properties:
      time.Time:
        type: string
    type: object
  xml.Attr:
    properties:
      name:
        $ref: '#/definitions/xml.Name'
      value:
        type: string
    type: object
  xml.Name:
    properties:
      local:
        type: string
      space:
        type: string
    type: object
info:
  contact: {}
  description: Event-driven Go API backed by MongoDB and Redis. Every request carries
    a correlation ID (X-Correlation-ID), generated by the server if the caller doesn't
    supply one.
  title: Metarr API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Compares the submitted username/password against the stored admin
        credentials and issues a session API key carrying admin rights.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: invalid request body
          schema:
            type: string
        "401":
          description: invalid username or password
          schema:
            type: string
        "429":
          description: too many requests
          schema:
            type: string
      summary: Log in as the admin user
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Revokes the session API key that authenticated this request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LogoutResponse'
        "429":
          description: too many requests
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Log out
      tags:
      - Auth
  /api/config:
    get:
      description: Reads the singleton application config document from MongoDB.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.Config'
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch the application config
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Fires a system_config_update event with the updated document as
        its payload and returns as soon as the event has been queued. The SystemConfigUpdate
        listener persists the change to MongoDB and then refreshes the in-memory config
        singleton.
      parameters:
      - description: Updated application config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.Config'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update the application config
      tags:
      - Config
  /api/config/admin:
    put:
      consumes:
      - application/json
      description: Updates any subset of the admin user's username, email, and password.
        A provided field cannot be empty. If password is set, it is re-hashed with
        a fresh salt.
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateAdminRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, or a provided field was empty
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update the admin user's credentials
      tags:
      - Config
  /api/config/agents:
    get:
      description: Returns configured agents merged with the agents currently connected
        to Redis, including live host telemetry for those that are online.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agentregistry.AgentView'
            type: array
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List agents
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: Creates a new agent configuration if the slug does not exist, or
        replaces every field of the existing entry otherwise. Each mapping ties one
        scan directory to the path that agent knows it by; a scan directory the agent
        cannot see is simply left out.
      parameters:
      - description: Agent to create or replace
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.AgentConfig'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, bad slug, or an unusable mapping
          schema:
            type: string
        "409":
          description: a scan directory is already mapped to a different agent
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Create or replace an agent
      tags:
      - Config
  /api/config/agents/{slug}:
    delete:
      description: Removes an agent's configuration and the copy it reads from Redis,
        so a machine that reconnects later does not resume scanning a library it is
        no longer meant to touch. The agent process itself is unaffected and will
        reappear as unconfigured while it keeps running.
      parameters:
      - description: Agent slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "404":
          description: no agent with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Delete an agent
      tags:
      - Config
  /api/config/agents/{slug}/log-level:
    post:
      consumes:
      - application/json
      description: Switches a single agent between info and debug. If the agent isn't
        configured with any libraries yet, this creates a minimal entry for it rather
        than requiring it be configured first.
      parameters:
      - description: Agent slug
        in: path
        name: slug
        required: true
        type: string
      - description: Log level
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.setAgentLogLevelRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body or log_level
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Set one agent's log level
      tags:
      - Config
  /api/config/directory-scanner:
    get:
      description: Reads the application config from MongoDB and returns the directory
        scanner section (parallel_count and scan_directories).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.DirectoryScannerConfig'
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch the directory scanner config
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Updates parallel_count. A provided value must be greater than zero.
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateDirectoryScannerRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, or parallel_count was not greater than
            zero
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update the directory scanner config
      tags:
      - Config
  /api/config/directory-scanner/directories:
    get:
      description: Reads the application config from MongoDB and returns every configured
        scan directory.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appconfig.ScanDirectory'
            type: array
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List scan directories
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: Creates a new scan directory if scanner_slug doesn't already exist,
        or replaces every field of the existing entry otherwise. scanner_slug is required,
        and scan_type must be one of "movie", "tv" or "music_video".
      parameters:
      - description: Scan directory to create or replace
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.ScanDirectory'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, missing scanner_slug, or unknown scan_type
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Create or replace a scan directory
      tags:
      - Config
  /api/config/directory-scanner/directories/{slug}:
    delete:
      description: Removes the scan directory with the given scanner_slug and fires
        system_config_update with the resulting document.
      parameters:
      - description: scanner_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "404":
          description: no scan directory with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Delete a scan directory
      tags:
      - Config
    get:
      description: Reads the application config from MongoDB and returns the scan
        directory instance with the given scanner_slug.
      parameters:
      - description: scanner_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.ScanDirectory'
        "404":
          description: no scan directory with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a single scan directory
      tags:
      - Config
  /api/config/directory-scanner/sidecar-types:
    get:
      description: Reads the application config from MongoDB and returns the sidecar
        classification table. Each entry carries an id, which is what the other endpoints
        address it by, and an order, which is the sequence the scanner evaluates entries
        in. An order of 0 means the entry is disabled and never evaluated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appconfig.SidecarTypeDefinition'
            type: array
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List sidecar types
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: 'Creates a new sidecar type when id is empty, minting one, or replaces
        the definition of an existing entry when id names one. type is required and
        must be unique, category must be one of the known categories, and every pattern
        must be a valid Go regular expression. This endpoint does not set order: a
        new type is created disabled (order 0), an existing type keeps the order it
        already had, and order is changed only through POST /api/config/directory-scanner/sidecar-types/order.'
      parameters:
      - description: Sidecar type to create or replace
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.SidecarTypeDefinition'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, missing type, unknown category, an invalid
            pattern, or a non-zero order
          schema:
            type: string
        "404":
          description: no sidecar type with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Create or replace a sidecar type
      tags:
      - Config
  /api/config/directory-scanner/sidecar-types/{id}:
    delete:
      description: Removes the sidecar type with the given id and fires system_config_update
        with the resulting document. Files that used to classify as this type will
        fall through to whatever the rest of the table says, or to "unknown". To stop
        a type classifying without losing its patterns, set its order to 0 through
        the ordering endpoint instead.
      parameters:
      - description: sidecar type id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "404":
          description: no sidecar type with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Delete a sidecar type
      tags:
      - Config
    get:
      description: Reads the application config from MongoDB and returns the sidecar
        type definition with the given id.
      parameters:
      - description: sidecar type id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.SidecarTypeDefinition'
        "404":
          description: no sidecar type with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a single sidecar type
      tags:
      - Config
  /api/config/directory-scanner/sidecar-types/order:
    post:
      consumes:
      - application/json
      description: Assigns an evaluation order to every sidecar type in one transaction.
        The body maps sidecar type id to order; the scanner takes the first entry
        that accepts a file, so lower numbers win. An order of 0 disables an entry,
        which keeps it in the table but stops it classifying anything. Every stored
        id must appear, orders must be unique among enabled entries, and an unknown
        id is rejected.
      parameters:
      - description: Map of sidecar type id to order
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ReorderSidecarTypesRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, an unknown or missing id, or a duplicate
            order
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Set the sidecar type evaluation order
      tags:
      - Config
  /api/config/directory-scanner/sidecar-types/reset:
    post:
      description: Replaces the entire sidecar classification table with the built-in
        defaults, discarding any customization, and fires system_config_update with
        the resulting document.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Restore the built-in sidecar types
      tags:
      - Config
  /api/config/interfaces/sonarr:
    get:
      description: Reads the application config from MongoDB and returns every configured
        Sonarr instance.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appconfig.SonarrInstance'
            type: array
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List Sonarr interface instances
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: Creates a new Sonarr instance if instance_slug doesn't already
        exist, or replaces every field of the existing entry otherwise. instance_slug
        is required and must be unique across every interface type.
      parameters:
      - description: Sonarr instance to create or replace
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.SonarrInstance'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body or missing instance_slug
          schema:
            type: string
        "409":
          description: instance_slug already in use by a different interface type
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Create or replace a Sonarr interface instance
      tags:
      - Config
  /api/config/interfaces/sonarr/{slug}:
    delete:
      description: Removes the Sonarr instance with the given instance_slug and fires
        system_config_update with the resulting document.
      parameters:
      - description: instance_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "404":
          description: no Sonarr instance with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Delete a Sonarr interface instance
      tags:
      - Config
    get:
      description: Reads the application config from MongoDB and returns the Sonarr
        instance with the given instance_slug.
      parameters:
      - description: instance_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.SonarrInstance'
        "404":
          description: no Sonarr instance with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a single Sonarr interface instance
      tags:
      - Config
  /api/config/logging:
    get:
      description: Returns the server's own log level and the informational pipeline
        fields shown on the System > Logging screen. Endpoint/sink/stream are informational
        only — the actual pipeline is Fluent Bit, configured independently of this
        document.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.LoggingConfig'
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch the logging configuration
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: 'Replaces the logging section: the server''s own log level, and
        the informational sink/endpoint/stream fields. Changing the informational
        fields does not reconfigure Fluent Bit — see the LoggingConfig doc comment.'
      parameters:
      - description: Logging configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.LoggingConfig'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body or server_level
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update the logging configuration
      tags:
      - Config
  /api/heartbeat:
    get:
      description: Publishes a heartbeat request on the Redis Pub/Sub queue and blocks
        until the heartbeat listener replies with the current time and the request's
        correlation ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HeartbeatResponse'
        "429":
          description: too many requests
          schema:
            type: string
        "504":
          description: heartbeat timed out
          schema:
            type: string
      summary: Blocking heartbeat check
      tags:
      - Heartbeat
  /api/local-directories:
    get:
      description: Returns the directory records in the local_directory collection,
        optionally filtered by media type and scan root path.
      parameters:
      - description: 'Filter by media type: movie, tv or music_video'
        in: query
        name: type
        type: string
      - description: Filter by the configured scan directory these were found under
        in: query
        name: scan_root
        type: string
      - description: Maximum records to return (default 100, max 500)
        in: query
        name: limit
        type: integer
      - description: Records to skip
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/scanmodel.TVSeries'
            type: array
        "400":
          description: invalid type, limit or skip
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List scanned directories
      tags:
      - Media
  /api/local-directories/{id}:
    get:
      description: Returns one directory record by its generated id.
      parameters:
      - description: Directory record id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scanmodel.TVSeries'
        "400":
          description: malformed id
          schema:
            type: string
        "404":
          description: no directory with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a scanned directory
      tags:
      - Media
  /api/local-directories/{id}/media-files:
    get:
      description: Returns the media file records — the movie, episode or music video
        files themselves — belonging to one scanned directory.
      parameters:
      - description: Directory record id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/scanmodel.MediaFile'
            type: array
        "400":
          description: malformed id
          schema:
            type: string
        "404":
          description: no directory with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List a directory's media files
      tags:
      - Media
  /api/local-directories/{id}/nfo:
    get:
      description: Reads and parses one .nfo file inside a scanned directory, live
        from disk rather than from the scan snapshot. The path is relative to the
        directory and may not escape it.
      parameters:
      - description: Directory record id
        in: path
        name: id
        required: true
        type: string
      - description: Path to the .nfo file, relative to the directory
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/metadata.Metadata'
        "400":
          description: missing or unsafe path, or not an .nfo file
          schema:
            type: string
        "404":
          description: no directory with that id, or no such file
          schema:
            type: string
        "422":
          description: the file could not be parsed
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Read an NFO file from disk
      tags:
      - Media
  /api/logging/tail:
    get:
      description: Returns the most recent log records seen on the centralized logging
        channel, from every process (server and every agent) that has published to
        it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/logging.Record'
            type: array
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch the recent log tail
      tags:
      - Config
  /api/media-files/{id}:
    get:
      description: Returns one media file record by its generated id, including its
        own NFO metadata, subtitles, artwork and episode ids.
      parameters:
      - description: Media file record id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scanmodel.MediaFile'
        "400":
          description: malformed id
          schema:
            type: string
        "404":
          description: no media file with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a media file record
      tags:
      - Media
  /api/stats/redis:
    get:
      description: Returns the depth and consumer-group state of every event stream,
        the subscriber count of every Pub/Sub channel, and server-wide counters. The
        same data streams over the stats.redis WebSocket topic.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/redisstats.Snapshot'
        "500":
          description: failed to collect redis statistics
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch Redis statistics
      tags:
      - Stats
  /api/tasks/directory-scan/{slug}:
    post:
      consumes:
      - application/json
      description: Scans the configured scan directory with the given scanner_slug,
        storing one record per media item directory plus one per media file in the
        local_directory collection. Fires the directory_scan event onto the durable
        event stream and returns as soon as it has been queued.
      parameters:
      - description: scanner_slug of the scan directory to scan
        in: path
        name: slug
        required: true
        type: string
      - description: Command to run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TaskRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, unsupported command, or the entry has
            an unusable scan_type
          schema:
            type: string
        "404":
          description: no scan directory with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Trigger a directory scan
      tags:
      - Tasks
  /api/tasks/sonarr_cache_data:
    post:
      consumes:
      - application/json
      description: Fires the sonarr_cache_data event onto the durable event stream
        in a non-blocking way and returns as soon as the event has been queued.
      parameters:
      - description: Command to run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TaskRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body or unsupported command
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Trigger the sonarr_cache_data background job
      tags:
      - Tasks
  /api/workflows:
    get:
      description: Returns the latest version of every saved workflow, newest first,
        paginated by an opaque cursor.
      parameters:
      - description: Maximum records to return (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from a previous page's next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WorkflowListResponse'
        "400":
          description: invalid limit or cursor
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List workflows
      tags:
      - Workflows
    post:
      consumes:
      - application/json
      description: Creates a new workflow, or appends a new version to an existing
        one if document_id is set. Every save is a new version — nothing is overwritten
        in place.
      parameters:
      - description: Workflow to save
        in: body
        name: workflow
        required: true
        schema:
          $ref: '#/definitions/mongostore.Workflow'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/mongostore.Workflow'
        "400":
          description: malformed body, or missing name/description/tags
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Save a workflow
      tags:
      - Workflows
  /api/workflows/{id}:
    get:
      description: Returns the latest version of one workflow.
      parameters:
      - description: Workflow id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mongostore.Workflow'
        "400":
          description: malformed id
          schema:
            type: string
        "404":
          description: no workflow with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a workflow
      tags:
      - Workflows
  /api/workflows/{id}/versions:
    get:
      description: Returns every saved version of one workflow, newest first, for
        the version-history strip.
      parameters:
      - description: Workflow id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/mongostore.Workflow'
            type: array
        "400":
          description: malformed id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List a workflow's versions
      tags:
      - Workflows
  /api/workflows/{id}/versions/{version}:
    get:
      description: Returns one specific past version of a workflow, exactly as it
        was saved.
      parameters:
      - description: Workflow id
        in: path
        name: id
        required: true
        type: string
      - description: Version number
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mongostore.Workflow'
        "400":
          description: malformed id or version
          schema:
            type: string
        "404":
          description: no such workflow or version
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch one workflow version
      tags:
      - Workflows
securityDefinitions:
  ApiKeyHeaderAuth:
    description: API key via the X-Api-Key header.
    in: header
    name: X-Api-Key
    type: apiKey
  ApiKeyQueryAuth:
    description: API key via the apikey query parameter. Either this or ApiKeyHeaderAuth
      satisfies auth on protected routes.
    in: query
    name: apikey
    type: apiKey
swagger: "2.0"

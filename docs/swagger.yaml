info:
  contact: {}
  description: Event-driven Go API backed by MongoDB and Redis. Every request carries
    a correlation ID (X-Correlation-ID), generated by the server if the caller doesn't
    supply one.
  title: Metarr API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Compares the submitted username/password against the stored admin
        credentials and issues a session API key carrying admin rights.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: invalid request body
          schema:
            type: string
        "401":
          description: invalid username or password
          schema:
            type: string
        "429":
          description: too many requests
          schema:
            type: string
      summary: Log in as the admin user
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Revokes the session API key that authenticated this request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LogoutResponse'
        "429":
          description: too many requests
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Log out
      tags:
      - Auth
  /api/config:
    get:
      description: Reads the singleton application config document from MongoDB.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.Config'
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch the application config
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Fires a system_config_update event with the updated document as
        its payload and returns as soon as the event has been queued. The SystemConfigUpdate
        listener persists the change to MongoDB and then refreshes the in-memory config
        singleton.
      parameters:
      - description: Updated application config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.Config'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update the application config
      tags:
      - Config
  /api/config/admin:
    put:
      consumes:
      - application/json
      description: Updates any subset of the admin user's username, email, and password.
        A provided field cannot be empty. If password is set, it is re-hashed with
        a fresh salt.
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateAdminRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, or a provided field was empty
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update the admin user's credentials
      tags:
      - Config
  /api/config/directory-scanner:
    get:
      description: Reads the application config from MongoDB and returns the directory
        scanner section (parallel_count and scan_directories).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.DirectoryScannerConfig'
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch the directory scanner config
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Updates parallel_count. A provided value must be greater than zero.
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateDirectoryScannerRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, or parallel_count was not greater than
            zero
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update the directory scanner config
      tags:
      - Config
  /api/config/directory-scanner/directories:
    get:
      description: Reads the application config from MongoDB and returns every configured
        scan directory.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appconfig.ScanDirectory'
            type: array
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List scan directories
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: Adds a new scan directory. scanner_slug is required and must be
        unique, and scan_type must be one of "movie", "tv" or "music_video".
      parameters:
      - description: New scan directory
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.ScanDirectory'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, missing scanner_slug, or unknown scan_type
          schema:
            type: string
        "409":
          description: scanner_slug already in use
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Add a scan directory
      tags:
      - Config
  /api/config/directory-scanner/directories/{slug}:
    delete:
      description: Removes the scan directory with the given scanner_slug and fires
        system_config_update with the resulting document.
      parameters:
      - description: scanner_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "404":
          description: no scan directory with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Delete a scan directory
      tags:
      - Config
    get:
      description: Reads the application config from MongoDB and returns the scan
        directory instance with the given scanner_slug.
      parameters:
      - description: scanner_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.ScanDirectory'
        "404":
          description: no scan directory with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a single scan directory
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Replaces every field of the scan directory at the given scanner_slug
        except scanner_slug itself, which cannot be changed once set. scan_type must
        be one of "movie", "tv" or "music_video".
      parameters:
      - description: scanner_slug
        in: path
        name: slug
        required: true
        type: string
      - description: Updated scan directory
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.ScanDirectory'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, attempted to change scanner_slug, or
            unknown scan_type
          schema:
            type: string
        "404":
          description: no scan directory with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update a scan directory
      tags:
      - Config
  /api/config/interfaces/sonarr:
    get:
      description: Reads the application config from MongoDB and returns every configured
        Sonarr instance.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appconfig.SonarrInstance'
            type: array
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List Sonarr interface instances
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: Adds a new Sonarr instance. instance_slug is required and must
        be unique across every interface type.
      parameters:
      - description: New Sonarr instance
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.SonarrInstance'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body or missing instance_slug
          schema:
            type: string
        "409":
          description: instance_slug already in use
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Create a Sonarr interface instance
      tags:
      - Config
  /api/config/interfaces/sonarr/{slug}:
    delete:
      description: Removes the Sonarr instance with the given instance_slug and fires
        system_config_update with the resulting document.
      parameters:
      - description: instance_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "404":
          description: no Sonarr instance with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Delete a Sonarr interface instance
      tags:
      - Config
    get:
      description: Reads the application config from MongoDB and returns the Sonarr
        instance with the given instance_slug.
      parameters:
      - description: instance_slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appconfig.SonarrInstance'
        "404":
          description: no Sonarr instance with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a single Sonarr interface instance
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Replaces every field of the Sonarr instance at the given instance_slug
        except instance_slug itself, which cannot be changed once set.
      parameters:
      - description: instance_slug
        in: path
        name: slug
        required: true
        type: string
      - description: Updated Sonarr instance
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appconfig.SonarrInstance'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, or attempted to change instance_slug
          schema:
            type: string
        "404":
          description: no Sonarr instance with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Update a Sonarr interface instance
      tags:
      - Config
  /api/heartbeat:
    get:
      description: Publishes a heartbeat request on the Redis Pub/Sub queue and blocks
        until the heartbeat listener replies with the current time and the request's
        correlation ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HeartbeatResponse'
        "429":
          description: too many requests
          schema:
            type: string
        "504":
          description: heartbeat timed out
          schema:
            type: string
      summary: Blocking heartbeat check
      tags:
      - Heartbeat
  /api/local-directories:
    get:
      description: Returns the directory records in the local_directory collection,
        optionally filtered by media type and scan root path.
      parameters:
      - description: 'Filter by media type: movie, tv or music_video'
        in: query
        name: type
        type: string
      - description: Filter by the configured scan directory these were found under
        in: query
        name: scan_root
        type: string
      - description: Maximum records to return (default 100, max 500)
        in: query
        name: limit
        type: integer
      - description: Records to skip
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/mediascan.LocalDirectory'
            type: array
        "400":
          description: invalid type, limit or skip
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List scanned directories
      tags:
      - Media
  /api/local-directories/{id}:
    get:
      description: Returns one directory record by its generated id.
      parameters:
      - description: Directory record id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mediascan.LocalDirectory'
        "400":
          description: malformed id
          schema:
            type: string
        "404":
          description: no directory with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a scanned directory
      tags:
      - Media
  /api/local-directories/{id}/media-files:
    get:
      description: Returns the media file records — the movie, episode or music video
        files themselves — belonging to one scanned directory.
      parameters:
      - description: Directory record id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/mediascan.MediaFile'
            type: array
        "400":
          description: malformed id
          schema:
            type: string
        "404":
          description: no directory with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: List a directory's media files
      tags:
      - Media
  /api/local-directories/{id}/nfo:
    get:
      description: Reads and parses one .nfo file inside a scanned directory, live
        from disk rather than from the scan snapshot. The path is relative to the
        directory and may not escape it.
      parameters:
      - description: Directory record id
        in: path
        name: id
        required: true
        type: string
      - description: Path to the .nfo file, relative to the directory
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nfo.Document'
        "400":
          description: missing or unsafe path, or not an .nfo file
          schema:
            type: string
        "404":
          description: no directory with that id, or no such file
          schema:
            type: string
        "422":
          description: the file could not be parsed
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Read an NFO file from disk
      tags:
      - Media
  /api/media-files/{id}:
    get:
      description: Returns one media file record by its generated id, including its
        own NFO metadata, subtitles, artwork and episode ids.
      parameters:
      - description: Media file record id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mediascan.MediaFile'
        "400":
          description: malformed id
          schema:
            type: string
        "404":
          description: no media file with that id
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Fetch a media file record
      tags:
      - Media
  /api/tasks/directory-scan/{slug}:
    post:
      consumes:
      - application/json
      description: Scans the configured scan directory with the given scanner_slug,
        storing one record per media item directory plus one per media file in the
        local_directory collection. Fires the directory_scan event onto the durable
        event stream and returns as soon as it has been queued.
      parameters:
      - description: scanner_slug of the scan directory to scan
        in: path
        name: slug
        required: true
        type: string
      - description: Command to run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TaskRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body, unsupported command, or the entry has
            an unusable scan_type
          schema:
            type: string
        "404":
          description: no scan directory with that slug
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Trigger a directory scan
      tags:
      - Tasks
  /api/tasks/sonarr_cache_data:
    post:
      consumes:
      - application/json
      description: Fires the sonarr_cache_data event onto the durable event stream
        in a non-blocking way and returns as soon as the event has been queued.
      parameters:
      - description: Command to run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TaskRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.AcceptedResponse'
        "400":
          description: invalid request body or unsupported command
          schema:
            type: string
      security:
      - ApiKeyHeaderAuth: []
      - ApiKeyQueryAuth: []
      summary: Trigger the sonarr_cache_data background job
      tags:
      - Tasks
securityDefinitions:
  ApiKeyHeaderAuth:
    description: API key via the X-Api-Key header.
    in: header
    name: X-Api-Key
    type: apiKey
  ApiKeyQueryAuth:
    description: API key via the apikey query parameter. Either this or ApiKeyHeaderAuth
      satisfies auth on protected routes.
    in: query
    name: apikey
    type: apiKey
swagger: "2.0"

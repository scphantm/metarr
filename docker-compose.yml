services:
  mongodb:
    image: mongo:latest
    container_name: metarr-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me-root-password}
      MONGO_DATABASE: ${MONGO_DATABASE:-metarr}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppassword}
      MONGO_READONLY_USERNAME: ${MONGO_READONLY_USERNAME:-readonly}
      MONGO_READONLY_PASSWORD: ${MONGO_READONLY_PASSWORD:-readonlypassword}
    volumes:
      - mongodb_data:/data/db
      - ./config/mongo-init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - metarr-net

  redis:
    image: redis:7-alpine
    container_name: metarr-redis
    restart: always
    # Agents connect to Redis from other machines, so this port is genuinely
    # reachable rather than a convenience for local tooling. A password is the
    # minimum that makes that safe; for anything crossing an untrusted network,
    # terminate TLS in front of it as well.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-metarr}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - metarr-net

  mongo-express:
    image: mongo-express:latest
    container_name: metarr-mongo-express
    restart: unless-stopped
    environment:
      # Root creds so the admin UI can browse every database; reaches
      # mongodb by its service name over the internal network below,
      # never via the host's external IP. Unlike compooss (which this
      # service replaces), mongo-express actually honors this at startup
      # and comes up already connected — no manual UI step required.
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-change-me-root-password}@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    ports:
      - "6969:8081"
    depends_on:
      - mongodb
    networks:
      - metarr-net

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: metarr-openobserve
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-admin@example.com}
      # OpenObserve enforces a real password policy at startup (8-128 chars,
      # upper+lower+digit+special) and refuses to boot otherwise — the
      # default below satisfies it, but change it for anything beyond local
      # dev.
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-Metarr123!}
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data
    networks:
      - metarr-net

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: metarr-fluent-bit
    restart: unless-stopped
    depends_on:
      - openobserve
    environment:
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_STREAM: ${OPENOBSERVE_STREAM:-metarr_app}
      OPENOBSERVE_ROOT_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-admin@example.com}
      OPENOBSERVE_ROOT_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-Metarr123!}
    ports:
      # metarr-server runs directly on the host for now (not yet packaged
      # into this compose file) and forwards here. Publishing the port is
      # what lets config/server.local.yaml forward_url reach it via localhost.
      - "8888:8888"
    volumes:
      - ./config/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    networks:
      - metarr-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    environment:
      # Pre-configures a database connection at startup (RedisInsight's
      # documented mechanism for this) so it's already connected on first
      # load instead of requiring the connection to be added manually
      # through the UI.
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: metarr-redis
      # Redis requires auth (see the redis service's --requirepass above);
      # without this the pre-configured connection above fails silently and
      # has to be re-entered by hand on first load.
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-metarr}
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    networks:
      - metarr-net
    depends_on:
      - redis

volumes:
  mongodb_data:
  redis_data:
  redis-insight-data:
  openobserve_data:

networks:
  metarr-net:
    driver: bridge

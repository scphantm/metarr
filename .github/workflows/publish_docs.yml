name: Build and Deploy Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build documentation in Docker
        run: |
          docker build -f Dockerfile.documentation -t metarr-docs:latest .
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            metarr-docs:latest \
            sh -c 'make docs_build'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
